[package]
name = "navi-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
description = "Domain-neutral local SQLite storage for NaviWealth."

[workspace]

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
