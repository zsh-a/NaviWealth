[package]
name = "navi-health"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
description = "Host-independent health models, calculations, recognition and validated storage."

[workspace]

[dependencies]
navi-storage = { path = "../navi-storage" }
jiff = { version = "1.0", default-features = false, features = ["std", "serde"] }
log = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"
