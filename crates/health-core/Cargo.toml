[package]
name = "health-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
description = "Shared, host-independent meal recognition and photo preparation."

[workspace]

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
llm-protocol = { path = "../../third_party/agent-runtime/crates/llm-protocol" }
llm-client = { path = "../../third_party/agent-runtime/crates/llm-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
futures = "0.3"

[lints.rust]
unsafe_code = "forbid"
