[package]
name = "lifeos_native"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
description = "Native primitives for NaviWealth / LifeOS (D-1.7c: EmbeddingGemma embedder via fastembed)."

# Single FFI surface for the Flutter app. Builds as both cdylib (iOS /
# macOS / Android dynamic linking) and staticlib (iOS device archive).
[lib]
name = "lifeos_native"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# fastembed wraps `ort` (ONNX Runtime) — much simpler DX than candle
# for embedding inference. `UserDefinedEmbeddingModel` lets us load
# the EmbeddingGemma ONNX export from disk. We disable defaults to
# drop hf-hub (we ship our own model loading) and image-models.
#
# `ort-load-dynamic` instead of `ort-download-binaries`: ORT's
# prebuilt static archives ship duplicate `.o` files across their
# sub-libraries (libonnx_proto.a + libonnxruntime_optimizer.a etc.
# all contain a copy of `onnx-ml.pb.cc.o`), which surfaces as ~756
# "duplicate symbol" errors when force-loaded into the Flutter app.
# Dynamic loading avoids the issue — ORT is shipped as a separate
# `libonnxruntime.dylib` / `.so` / `.dll` discovered at runtime via
# `ORT_DYLIB_PATH`. The Flutter side bundles the dylib alongside
# the app; see `apps/mobile/native/lifeos_native/README.md`.
fastembed = { version = "5.17.2", default-features = false, features = ["ort-load-dynamic"] }
anyhow = "1.0.102"
agent-core = { path = "../../../../third_party/agent-runtime/crates/agent-core" }
agent_runtime_upstream = { package = "agent-runtime", path = "../../../../third_party/agent-runtime/crates/agent-runtime" }
agent-chat = { path = "../../../../third_party/agent-runtime/crates/agent-chat" }
agent-llm = { path = "../../../../third_party/agent-runtime/crates/agent-llm" }
futures = "0.3"
# flutter_rust_bridge generates Dart bindings from these signatures.
# Surface in `src/api/` is the only thing the codegen looks at;
# everything else stays private to the crate.
flutter_rust_bridge = "=2.13.0"

# Health / Garmin integration
reqwest = { version = "0.13.4", features = ["json", "cookies", "rustls", "form"], default-features = false }
rustls = { version = "0.23.41", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["time", "sync", "macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.23.2", features = ["v4"] }
async-trait = "0.1.89"
once_cell = "1.21.4"
base64 = "0.22.1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
rustls-platform-verifier = "0.7.0"

[profile.release]
# Smaller binary; matters for mobile bundle size.
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[workspace]
