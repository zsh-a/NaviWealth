org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Safety net for stale third-party plugins (e.g. receive_sharing_intent,
# Kotlin 1.9.22) whose android/build.gradle sets no compileOptions: the root
# build.gradle.kts already realigns their Java target to 17, but should any
# plugin's extension-injection ordering miss, downgrade Gradle's JVM-target
# inconsistency from a hard build failure to a warning. The :app module is
# uniformly Java 17 / Kotlin 17, so no real mixed-target bytecode ships.
kotlin.jvm.target.validation.mode=warning
