org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Stale third-party plugins (e.g. receive_sharing_intent, which still targets
# Kotlin 1.9.22) ship no `compileOptions`, so AGP compiles their Java at 1.8
# while this project's Kotlin 2.x toolchain targets 17 — Gradle's JVM-target
# validation then hard-fails ':<plugin>:compileReleaseKotlin'. Downgrade that
# check to a warning. This is benign: D8/R8 dexes both 1.8 and 17 class files
# identically into the APK, and the :app module is uniformly Java 17 / Kotlin
# 17, so no mixed-target code ships in our own sources. A root-script
# afterEvaluate override can't do this reliably (plugin-loader evaluates some
# subprojects before the root script runs); this property is build-wide and
# ordering-independent.
kotlin.jvm.target.validation.mode=warning
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
