<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="256" height="256">
  <defs>
    <!-- 暗色背景渐变 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <!-- 财富与科技的蓝绿渐变 (Tech Blue to Wealth Green) -->
    <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>
  
  <!-- 苹果 App Icon 风格的圆角矩形 -->
  <rect width="512" height="512" rx="120" fill="url(#bg)" />
  
  <!-- 指南针外环 -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#334155" stroke-width="24" stroke-dasharray="80 30" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#334155" stroke-width="4" />

  <!-- 指向上方的财富指针 (北偏东，隐喻右上方的K线图增长) -->
  <path d="M226 286 L346 166 L270 320 Z" fill="url(#accent)" />
  <!-- 指针的暗色配重部分 -->
  <path d="M226 286 L166 346 L242 192 Z" fill="#475569" opacity="0.6" />
  
  <!-- AI / 核心节点 -->
  <circle cx="256" cy="256" r="20" fill="#F8FAFC" box-shadow="0 0 20px #3B82F6" />
</svg>