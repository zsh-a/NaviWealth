include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    # `flutter_rust_bridge`-generated bindings (D-1.7c). Strict-inference
    # noise here is upstream — we lint the wrapper, not the codegen output.
    - "lib/src/rust/**"
    # Cargokit vendored build tool (D-1.7c). Standalone Dart package with
    # its own pubspec.yaml; its deps aren't resolved by the parent
    # `flutter pub get`, so every import shows as undefined.
    # README.md inside says "Please ignore this folder."
    - "rust_builder/**"
linter:
  rules:
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - avoid_dynamic_calls
    - avoid_print
    - require_trailing_commas
    - sort_pub_dependencies
    - unawaited_futures
    - use_super_parameters
    - prefer_single_quotes
    - directives_ordering
