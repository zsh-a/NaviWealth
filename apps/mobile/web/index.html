<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NaviWealth - 个人财务管理软件">
  <meta name="theme-color" content="#0F172A">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NaviWealth">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NaviWealth</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Self-hosted Latin + CJK web fonts.

    Latin tier — Inter (4 weights) + Outfit Bold, generated by
      apps/mobile/tool/build-latin-fonts.sh. Inter is the primary font
      family; Outfit is reserved for the dashboard hero number
      (Display 2XL). Combined Latin subset is < 200 KB.

    CJK tier — AppCnSans (Noto Sans SC subset), generated by
      apps/mobile/tool/build-cn-fonts.sh. The base file is preloaded so
      the request kicks off in parallel with flutter_bootstrap.js; the
      extension file only loads when a glyph outside the base subset is
      needed (free-text input, server message).

    `font-display: swap` paints with the platform font immediately and
    re-shapes once the woff2 arrives — never blocks first paint.
    `local()` lets users with the system font installed skip the
    download entirely (and provides offline fallback before the service
    worker has cached the woff2). FIR-104.
  -->
  <link rel="preload" href="assets/assets/fonts/inter-regular.woff2"
        as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/assets/fonts/inter-semibold.woff2"
        as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/assets/fonts/app-cn-base.woff2"
        as="font" type="font/woff2" crossorigin>
  <style>
    /* Inter — primary fontFamily. One @font-face per weight; the variable
       axis is collapsed at build time by varLib.instancer so each file
       is a single static cut. */
    @font-face {
      font-family: 'Inter';
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      src: local('Inter'),
           url('assets/assets/fonts/inter-regular.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Inter';
      font-weight: 500;
      font-style: normal;
      font-display: swap;
      src: local('Inter Medium'),
           url('assets/assets/fonts/inter-medium.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Inter';
      font-weight: 600;
      font-style: normal;
      font-display: swap;
      src: local('Inter SemiBold'),
           url('assets/assets/fonts/inter-semibold.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Inter';
      font-weight: 700;
      font-style: normal;
      font-display: swap;
      src: local('Inter Bold'),
           url('assets/assets/fonts/inter-bold.woff2') format('woff2');
    }

    /* Outfit — reserved for Display 2XL. */
    @font-face {
      font-family: 'Outfit';
      font-weight: 700;
      font-style: normal;
      font-display: swap;
      src: local('Outfit Bold'),
           url('assets/assets/fonts/outfit-bold.woff2') format('woff2');
    }

    /* AppCnSans — CJK subset. The Latin half of the unicode-range is
       intentionally narrow so the browser prefers Inter for ASCII and
       only reaches for AppCnSans on CJK / extended punctuation. */
    @font-face {
      font-family: 'AppCnSans';
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
      src: local('PingFang SC'),
           local('Hiragino Sans GB'),
           local('Microsoft YaHei'),
           local('Source Han Sans SC'),
           local('Noto Sans SC'),
           url('assets/assets/fonts/app-cn-base.woff2') format('woff2');
      unicode-range: U+3000-303F, U+4E00-9FFF,
                     U+F900-FAFF, U+FF00-FFEF;
    }
    @font-face {
      font-family: 'AppCnSans';
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
      /* Larger range than `base` — the browser only fetches this file
         when it needs a glyph that exists here but not in `base`. */
      src: url('assets/assets/fonts/app-cn-ext.woff2') format('woff2');
      unicode-range: U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+20000-2A6DF;
    }
    html, body {
      font-family: 'Inter', 'AppCnSans', 'PingFang SC', 'Hiragino Sans GB',
                   'Microsoft YaHei', 'Source Han Sans SC',
                   'Noto Sans SC', sans-serif;
      font-feature-settings: 'tnum' 1, 'lnum' 1;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
  // NaviWealth PWA bridge.
  //
  // Owns service-worker registration and exposes a single global
  // `window.naviwealthPwa` that the Flutter app talks to via JS interop
  // (see lib/core/pwa/pwa_update_web.dart). The bridge installs *before*
  // flutter_bootstrap.js so the SW is registering while Dart compiles.
  //
  // Build with `flutter build web --pwa-strategy=none` so Flutter does not
  // register its default service worker (newer Flutter may still emit a
  // zero-byte placeholder file, which is inert).
  (function () {
    var bridge = {
      updateAvailable: false,
      version: null,
      _listeners: [],
      onUpdateAvailable: function (cb) {
        this._listeners.push(cb);
        if (this.updateAvailable) {
          try { cb(); } catch (_) {}
        }
      },
      applyUpdate: function () {
        if (this._waiting) {
          this._waiting.postMessage({ type: 'SKIP_WAITING' });
        }
        // Reload once the new SW takes control. controllerchange fires on
        // every controller swap; the once flag avoids reload loops.
      },
    };
    window.naviwealthPwa = bridge;

    function notify() {
      bridge.updateAvailable = true;
      for (var i = 0; i < bridge._listeners.length; i++) {
        try { bridge._listeners[i](); } catch (_) {}
      }
      // Also dispatch a DOM event so non-Dart consumers (devtools, e2e
      // probes) can observe the same signal without poking at internals.
      window.dispatchEvent(new CustomEvent('naviwealth:pwa-update'));
    }

    function trackWaiting(reg) {
      if (reg.waiting) {
        bridge._waiting = reg.waiting;
        notify();
      }
      if (reg.installing) {
        var sw = reg.installing;
        sw.addEventListener('statechange', function () {
          if (sw.state === 'installed' && navigator.serviceWorker.controller) {
            // A previous SW is still active → this one is the update.
            bridge._waiting = sw;
            notify();
          }
        });
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker
          .register('service_worker.js', { scope: './' })
          .then(function (reg) {
            trackWaiting(reg);
            reg.addEventListener('updatefound', function () {
              trackWaiting(reg);
            });
            // Periodically poll the server for an updated SW. Browsers also
            // do this on navigation but the SPA navigation under go_router
            // doesn't trigger document loads, so without an explicit kick
            // a long-lived tab never notices a new deploy.
            setInterval(function () {
              reg.update().catch(function () {});
            }, 60 * 60 * 1000);
          })
          .catch(function (err) {
            console.warn('[naviwealth] SW registration failed', err);
          });

        var reloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (reloaded) return;
          reloaded = true;
          window.location.reload();
        });

        navigator.serviceWorker.addEventListener('message', function (ev) {
          var data = ev.data;
          if (!data || typeof data !== 'object') return;
          if (data.type === 'SW_ACTIVATED' || data.type === 'SW_VERSION') {
            bridge.version = data.version;
          }
        });
      });
    }
  })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
