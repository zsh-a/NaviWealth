<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NaviWealth - 个人财务管理软件">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="naviwealth">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>naviwealth</title>
  <link rel="manifest" href="manifest.json">

  <!--
    AppCnSans — pyftsubset of Noto Sans SC variable. Generated by
    apps/mobile/tool/build-cn-fonts.sh. Two tiers:
      * app-cn-base.woff2 ships first-paint glyphs (<= 250 KB).
        Preloaded so the request kicks off in parallel with
        flutter_bootstrap.js instead of after Flutter parses its bundle.
      * app-cn-ext.woff2 lazy-loads only when a glyph the base subset
        doesn't cover is needed (free-text input, server message).
    `font-display: swap` paints with the platform font immediately and
    re-shapes once the woff2 arrives — never blocks first paint.
    `local()` lets users with the system CJK font installed skip the
    download entirely and provides offline fallback before the service
    worker has cached the woff2.
  -->
  <link rel="preload" href="assets/assets/fonts/app-cn-base.woff2"
        as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: 'AppCnSans';
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
      src: local('PingFang SC'),
           local('Hiragino Sans GB'),
           local('Microsoft YaHei'),
           local('Source Han Sans SC'),
           local('Noto Sans SC'),
           url('assets/assets/fonts/app-cn-base.woff2') format('woff2');
      unicode-range: U+0020-007F, U+00A0-00FF, U+2000-206F, U+20A0-20CF,
                     U+2190-21FF, U+25A0-25FF, U+3000-303F, U+4E00-9FFF,
                     U+F900-FAFF, U+FF00-FFEF;
    }
    @font-face {
      font-family: 'AppCnSans';
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
      /* Larger range than `base` — the browser only fetches this file
         when it needs a glyph that exists here but not in `base`. */
      src: url('assets/assets/fonts/app-cn-ext.woff2') format('woff2');
      unicode-range: U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+20000-2A6DF;
    }
    html, body {
      font-family: 'AppCnSans', 'PingFang SC', 'Hiragino Sans GB',
                   'Microsoft YaHei', 'Source Han Sans SC',
                   'Noto Sans SC', sans-serif;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
