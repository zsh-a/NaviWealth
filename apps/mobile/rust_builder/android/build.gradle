// The Android Gradle Plugin builds the native code with the Android NDK.

group 'com.flutter_rust_bridge.lifeos_native'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath 'com.android.tools.build:gradle:7.3.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.flutter_rust_bridge.lifeos_native'
    }

    // Bumping the plugin compileSdkVersion requires all clients of this plugin
    // to bump the version in their app.
    compileSdkVersion 33

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specfic NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion android.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 19
    }
}

apply from: "../cargokit/gradle/plugin.gradle"
cargokit {
    manifestDir = "../../native/lifeos_native"
    libname = "lifeos_native"
}

// ONNX Runtime is dynamically loaded by the Rust `ort-load-dynamic`
// feature, so Android release/debug artifacts must package
// libonnxruntime.so for every ABI that Cargokit builds.
android.libraryVariants.all { variant ->
    def buildType = variant.buildType.name
    def capitalized = buildType.capitalize()
    def ortJniDir = file("$buildDir/generated/onnxruntime/jniLibs/$buildType")
    android.sourceSets.maybeCreate(buildType).jniLibs.srcDir(ortJniDir)

    def task = tasks.register("embedOnnxRuntime${capitalized}") {
        outputs.dir(ortJniDir)
        outputs.upToDateWhen { false }
        doLast {
            def platforms = []
            try {
                platforms = com.flutter.gradle.FlutterPluginUtils.getTargetPlatforms(project).collect()
            } catch (Exception ignored) {
                platforms = ["android-arm64"]
            }
            if (buildType == "debug") {
                platforms.add("android-arm")
                platforms.add("android-x86")
                platforms.add("android-x64")
            }
            def triples = platforms.collect { platform ->
                switch (platform) {
                    case "android-arm64": return "aarch64-linux-android"
                    case "android-arm": return "armv7-linux-androideabi"
                    case "android-x64": return "x86_64-linux-android"
                    case "android-x86": return "i686-linux-android"
                    default: return null
                }
            }.findAll { it != null }.unique()
            if (triples.isEmpty()) {
                triples = ["aarch64-linux-android"]
            }
            exec {
                executable "../../../../tool/embed-onnxruntime-android.sh"
                args ortJniDir.absolutePath, triples.join(",")
            }
        }
    }

    tasks.whenTaskAdded { newTask ->
        if (newTask.name == "merge${capitalized}NativeLibs") {
            newTask.dependsOn(task)
        }
    }
    tasks.matching { it.name == "merge${capitalized}NativeLibs" }.configureEach {
        dependsOn(task)
    }
}
