name: naviwealth
description: "NaviWealth - 个人财务管理软件"
publish_to: 'none'
version: 0.9.0+1

environment:
  sdk: ^3.13.0

# package:sqlite3 3.x bundles native libraries through Dart build hooks.
# Native NaviWealth builds use SQLCipher; Web continues to load sqlite3.wasm.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

dependencies:
  animations: ^3.0.0
  archive: ^4.1.0
  charset: ^2.0.1
  collection: ^1.19.1
  cross_file: ^0.3.5+4
  crypto: ^3.0.7
  cryptography: ^2.9.0
  decimal: ^3.2.4
  desktop_drop: ^0.8.0
  dio: ^5.10.0
  drift: ^2.34.2
  file_picker: ^12.0.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  # Local notifications are emitted only after the global attention arbiter
  # chooses the interrupt tier. The Web implementation is a no-op.
  flutter_local_notifications: ^22.0.1
  flutter_localizations:
    sdk: flutter
  # 3.3.2 regresses resumed provider chains by scheduling ProviderScope
  # refreshes during widget build (riverpod#4765). Keep this exact until the
  # upstream lifecycle fix ships.
  flutter_riverpod: 3.4.2
  flutter_rust_bridge: 2.13.0-beta.6
  flutter_secure_storage: ^11.0.0
  flutter_svg: ^2.3.0
  flutter_tts: ^4.2.5
  flutter_web_plugins:
    sdk: flutter
  forui: ^0.26.0
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  # D-2.2 (`docs/healthos-domain.md` §2): HealthKit (iOS) + Health Connect
  # (Android) adapter. Web is unsupported; conditional import returns a
  # not-supported stub there.
  health: ^13.3.2
  image_picker: ^1.2.3
  intl: ^0.20.3
  lifeos_native:
    path: rust_builder
  local_auth: ^3.0.2
  # Standards-compliant CommonMark/GFM parsing for settled KnowledgeOS
  # documents. Rendering remains local and token-driven; AI streaming keeps
  # its tolerant lightweight parser.
  markdown: ^7.3.1
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  # Keep this pinned to the last CocoaPods-compatible release. 1.9.0 is
  # SwiftPM-only on iOS, but this app's local lifeos_native FFI plugin still
  # relies on Cargokit's CocoaPods build phase for Rust.
  receive_sharing_intent: 1.9.0
  record: ^7.1.1
  # Sentry 9.25+ requires HybridSDK 8.58.4, but its macOS podspec still
  # reports 10.14 while that SDK requires a higher deployment target.
  # Keep the latest CocoaPods-compatible release until the plugin fixes its
  # reported macOS target.
  sentry_flutter: 9.27.0
  share_plus: ^13.2.1
  shared_preferences: ^2.5.5
  # 1.13.6 fixes the macOS release code signatures that previously required
  # pinning the macOS platform package to 1.13.4.
  sherpa_onnx: ^1.13.6
  sqlite3: ^3.5.2
  talker: ^5.1.19
  talker_dio_logger: ^5.1.19
  # Clickable markdown links in AI chat. Used behind a confirm dialog
  # so the user always sees the full URL before the OS hands it off —
  # AI replies are an untrusted surface (prompt-injection vector).
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  web: ^1.1.1
  # Cross-platform background task scheduler (Android WorkManager + iOS
  # BGTaskScheduler). Background callbacks only evaluate precomputed,
  # deterministic attention snapshots; they never invoke an LLM.
  workmanager: ^0.10.9
  xml: ^7.0.1

# D-2.2 (`docs/healthos-domain.md` §2): `health ^13.3.1` pins
# `device_info_plus ^12.1.0`, which pulls `win32 ^5.11.0` —
# incompatible with `package_info_plus 10.1+` and `file_picker 12.x`
# (both want `win32 ^6.x`) at compile time. Bumping
# `device_info_plus` to 13.x re-aligns the win32 chain; the health
# plugin only uses basic device-info APIs that haven't changed, so
# the override is safe in practice. Drop the override when health
# widens its pin or we replace `health` with a fork.
dependency_overrides:
  device_info_plus: ^13.0.0

dev_dependencies:
  build_runner: ^2.16.0
  # drift_dev 2.34.1+ requires analyzer 13, while freezed 3.2.5 currently
  # requires analyzer <11. Keep the generator pinned until those toolchains
  # converge; the runtime drift package can still take compatible patches.
  drift_dev: 2.34.5
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.0
  image: ^4.9.2
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  # FIR-76 — read-only securities catalog. Loaded on demand via
  # rootBundle (`SecuritiesCatalogLoader`); the file is NDJSON so it
  # lazy-streams cleanly on web (fetched on first search-page open
  # rather than baked into first-paint JS).
  assets:
    - assets/catalog/securities.v1.ndjson
    - assets/svg/logo.svg
  config:
    # Keep macOS/iOS plugin integration on CocoaPods for now. The local
    # lifeos_native FFI plugin builds Rust through Cargokit's CocoaPods script
    # phase, and enabling Flutter SPM makes Xcode wait on remote Swift package
    # artifact resolution during `flutter build macos`.
    enable-swift-package-manager: false

  fonts:
    # Inter — primary fontFamily for the entire app. Subset to Latin +
    # numbers + currency / arrow / box-drawing punctuation by
    # tool/build-latin-fonts.sh; the .woff2 files are build artifacts and
    # gitignored. CJK falls through fontFamilyFallback to AppCnSans on web
    # and to PingFang / YaHei / etc. on native. Combined Latin subset
    # budget: ≤ 200 KB (FIR-104).
    - family: Inter
      fonts:
        - asset: assets/fonts/inter-regular.woff2
          weight: 400
        - asset: assets/fonts/inter-medium.woff2
          weight: 500
        - asset: assets/fonts/inter-semibold.woff2
          weight: 600
        - asset: assets/fonts/inter-bold.woff2
          weight: 700

    # Outfit — used only by Display 2XL (the hero number on the home
    # dashboard). One bold-weight subset is enough; the rest of the type
    # ramp goes through Inter.
    - family: Outfit
      fonts:
        - asset: assets/fonts/outfit-bold.woff2
          weight: 700

    # AppCnSans — subset of Noto Sans SC variable, regenerated by
    # tool/build-cn-fonts.sh. Two tiers:
    #   app-cn-base.woff2 — first-paint glyphs (<= 335,000 B, gitignored)
    #   app-cn-ext.woff2  — lazy-loaded GB 2312 padding (gitignored)
    # The .woff2 files are build artifacts; run the script before
    # `flutter run -d chrome` / `flutter build web`. Listing them here
    # makes Flutter resolve `fontFamily: 'AppCnSans'` to these assets and
    # ensures `flutter build web` copies them under build/web/assets/.
    - family: AppCnSans
      fonts:
        - asset: assets/fonts/app-cn-base.woff2
        - asset: assets/fonts/app-cn-ext.woff2
