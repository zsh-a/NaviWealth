name: naviwealth
description: "NaviWealth - 个人财务管理软件"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  collection: ^1.19.1
  cryptography: ^2.7.0
  cupertino_icons: ^1.0.8
  decimal: ^3.0.2
  dio: ^5.7.0
  drift: ^2.20.3
  fl_chart: ^0.69.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^2.4.4
  go_router: ^14.6.2
  intl: ^0.20.2
  json_annotation: ^4.9.0
  logger: ^2.5.0
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  sqlcipher_flutter_libs: ^0.6.5
  sqlite3: ^2.4.0
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.20.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true

  # FIR-76 — read-only securities catalog. Loaded on demand via
  # rootBundle (`SecuritiesCatalogLoader`); the file is NDJSON so it
  # lazy-streams cleanly on web (fetched on first search-page open
  # rather than baked into first-paint JS).
  assets:
    - assets/catalog/securities.v1.ndjson

  fonts:
    # AppCnSans — subset of Noto Sans SC variable, regenerated by
    # tool/build-cn-fonts.sh. Two tiers:
    #   app-cn-base.woff2 — first-paint glyphs (<= 250 KB, gitignored)
    #   app-cn-ext.woff2  — lazy-loaded GB 2312 padding (gitignored)
    # The .woff2 files are build artifacts; run the script before
    # `flutter run -d chrome` / `flutter build web`. Listing them here
    # makes Flutter resolve `fontFamily: 'AppCnSans'` to these assets and
    # ensures `flutter build web` copies them under build/web/assets/.
    - family: AppCnSans
      fonts:
        - asset: assets/fonts/app-cn-base.woff2
        - asset: assets/fonts/app-cn-ext.woff2
