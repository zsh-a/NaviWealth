[package]
name = "naviwealth-backend"
version = "0.8.28"
edition = "2021"
authors = ["NaviWealth"]
description = "NaviWealth backend on Cloudflare Workers (Rust)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.8", features = ["http", "d1"] }
worker-macros = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["serde", "wasmbind", "clock"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }
console_error_panic_hook = "0.1"

# Auth (FIR-29). HS256 JWT is hand-rolled on hmac+sha2 because `jsonwebtoken`
# does not build for `wasm32-unknown-unknown` without a non-default crypto
# backend; argon2 is pure-Rust and salt entropy comes from `getrandom` (js).
argon2 = "0.5"
# Keep hmac and sha2 on the same digest trait family so `Hmac<Sha256>: Mac`
# remains valid for HS256 JWT and scoped-detail merchant hashes.
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
getrandom = { version = "0.2", features = ["js"] }

# AI assistant (FIR-59). `futures-channel` + `futures-util` give us an
# `mpsc::unbounded` we can hand to `Response::from_stream`, which is how the
# Anthropic streaming relay pumps SSE bytes back to the client without ever
# materialising the full body in memory. `wasm-bindgen-futures` is re-exported
# by `worker` itself but we use it directly to spawn the background relay.
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
wasm-bindgen = "0.2.125"
wasm-bindgen-futures = "0.4"
# WASM-friendly timers backed by `setTimeout`. We use it to drive the SSE
# keepalive heartbeat and the per-tool / overall conversation timeouts that
# stop the long-poll from hanging when an upstream call (D1 / Anthropic)
# stalls inside `spawn_local`. The `futures` feature exposes
# `TimeoutFuture` so we can `select` it against work futures.
gloo-timers = { version = "0.4", features = ["futures"] }

[dev-dependencies]
futures-executor = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
