[package]
name = "naviwealth-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NaviWealth nsh client: app composition, screens and design system"

[features]
default = ["desktop"]
# Desktop runners need the platform GUI stack (GTK 4.14+ on Linux). The
# lib, headless tests and the web target build without it.
desktop = [
    "dep:env_logger",
    "dep:nsh-platform-linux",
    "dep:nsh-platform-macos",
    "dep:nsh-platform-windows",
]

[dependencies]
nsh-core = "0.4.0"
nsh-base = "0.4.0"
env_logger = { version = "0.11", optional = true }
lifeos = { workspace = true, default-features = false, features = [
    "sqlcipher",
    "sync-http",
] }
naviwealth-finance.workspace = true
naviwealth-knowledge.workspace = true
naviwealth-execution.workspace = true
naviwealth-health.workspace = true
lifeos-platform.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tracing.workspace = true
log = "0.4"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
rusqlite.workspace = true
async-trait.workspace = true

# Device AI runtime (reused from third_party/agent-runtime).
agent-core = { path = "../../third_party/agent-runtime/crates/agent-core" }
agent-llm = { path = "../../third_party/agent-runtime/crates/agent-llm" }
agent-chat = { path = "../../third_party/agent-runtime/crates/agent-chat" }
agent-runtime = { path = "../../third_party/agent-runtime/crates/agent-runtime" }
agent-store = { path = "../../third_party/agent-runtime/crates/agent-store" }
futures = "0.3"

[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
nsh-platform-linux = { version = "0.4.0", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.4.0", default-features = false, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.4.0", default-features = false, optional = true }

[dev-dependencies]
nsh-engine = "0.4.0"
nsh-testing = "0.4.0"
