[package]
name = "nsh-app-naviwealth-health"
description = "NaviWealth's native (NSH) client: photo meal logging for HealthOS."
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
nsh-core = "0.5.0"
nsh-base = { version = "0.5.0", default-features = false }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
futures-lite = { version = "2", default-features = false, features = ["std"] }
# Local calendar dates from the device's time zone (Android's tzdata included).
jiff = "0.2"
# Normalizes picked photos the same way on every platform: upright, at most
# 1280 px, re-encoded as JPEG (which drops EXIF/GPS metadata).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.5.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.5.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.5.0", default-features = false }

[dev-dependencies]
nsh-engine = { version = "0.5.0", default-features = false }
nsh-testing = { version = "0.5.0", default-features = false }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
