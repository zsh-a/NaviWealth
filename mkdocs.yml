site_name: NaviWealth Docs
site_description: Local-first Personal LifeOS engineering documentation.
docs_dir: docs

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Architecture:
      - Northstar: architecture/lifeos-architecture-northstar.md
      - LifeOS Shell: architecture/lifeos-shell.md
  - Domains:
      - HealthOS: domains/healthos-domain.md
      - KnowledgeOS: domains/knowledgeos-domain.md
      - ExecutionOS: domains/executionos-domain.md
      - Options Income: domains/options-income.md
      - Market Data Providers: domains/market-data-providers.md
      - Garmin Integration: domains/garmin-integration-plan.md
  - AI:
      - Device AI Architecture: ai/ai-architecture.md
      - Runtime Event Contract: ai/ai-protocol.md
  - Sync:
      - Sync v2 Protocol: sync/sync-v2.md
      - Protocol Test Catalogue: sync/sync-protocol-tests.md
      - Manual E2E Checklist: sync/sync-e2e-manual.md
      - Monitoring: sync/sync-monitoring.md
  - Development:
      - Local Development: development/local-development.md
      - Testing Strategy: development/testing-strategy.md
      - Web Routing: development/web-routing.md
      - Web Compatibility Matrix: development/web-compat-matrix.md
  - Operations:
      - Branch Protection: operations/branch-protection.md
  - Roadmap:
      - LifeOS Roadmap: roadmap/roadmap-lifeos.md
      - FinanceOS Roadmap: roadmap/roadmap-finance.md
  - Decisions:
      - Phase D ADR: decisions/lifeos-decision-2026-05-24.md
  - Archive:
      - Archive Index: archive/README.md
      - Sync v1 Protocol: archive/sync-protocol.md
      - Historical Roadmaps:
          - 2026-05 Roadmap: archive/roadmaps/roadmap.md
          - Compatibility Roadmap: archive/roadmaps/roadmap-next.md
          - Phase 1 Plan: archive/roadmaps/roadmap-phase1.md
          - Midterm Execution Plan: archive/roadmaps/roadmap-midterm-execution.md
          - FIRE OS Plan: archive/roadmaps/roadmap-fire-os.md
      - Audits:
          - AI Boundary Audit: archive/audits/ai-boundary-audit.md
          - Implementation Audit: archive/audits/implementation-audit-2026-05-31.md
      - Plans:
          - Figma UI Refactor Plan: archive/plans/lifeos-figma-ui-refactor-plan.md
