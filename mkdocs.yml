site_name: NaviWealth Docs
site_description: Local-first personal finance and health app engineering documentation.
docs_dir: docs

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Agent Task Map: agent-map.md
  - Architecture:
      - NSH Migration ADR: architecture/adr/0001-nsh-client-migration.md
      - Personal Local Scope ADR: architecture/adr/0002-personal-local-scope.md
      - Flutter Retirement ADR: architecture/adr/0003-flutter-retirement.md
      - Agent Runtime: architecture/agent-runtime-current.md
  - Development:
      - Local Development: development/local-development.md
  - Operations:
      - Branch Protection: operations/branch-protection.md
  - Product Scope: product/product-scope.md
  - Roadmap:
      - NSH Client Roadmap: roadmap/roadmap-lifeos.md
      - Archived FinanceOS Roadmap: roadmap/roadmap-finance.md
      - Archived Product Direction And Demand Validation: roadmap/product-direction-and-demand-validation.md
