[package]
name = "register-user"
version = "0.1.0"
edition = "2021"
description = "CLI tool to register a user in NaviWealth D1 database"

[[bin]]
name = "register-user"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
password-hash = "0.5"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.2"
rpassword = "7"
