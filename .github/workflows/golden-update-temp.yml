name: golden update temp

on:
  push:
    branches: [agent/codex-eng/bb04b1f0]

defaults:
  run:
    working-directory: apps/mobile

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build golden font assets
        run: |
          tool/build-cn-fonts.sh
          tool/build-latin-fonts.sh
      - name: Update mobile goldens
        run: flutter test test/golden --tags=golden --update-goldens --reporter=expanded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updated-mobile-goldens
          path: apps/mobile/test/golden/goldens
          if-no-files-found: error
