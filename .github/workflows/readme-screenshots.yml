name: readme screenshots

on:
  pull_request:
    paths:
      - 'apps/mobile/lib/**'
      - 'apps/mobile/test/readme_screenshots/**'
      - 'apps/mobile/tool/update-readme-screenshots.sh'
      - 'apps/mobile/tool/validate_readme_screenshots.dart'
      - 'apps/mobile/assets/fonts/**'
      - 'docs/assets/readme/**'
      - 'README.md'
      - '.github/workflows/readme-screenshots.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/lib/**'
      - 'apps/mobile/test/readme_screenshots/**'
      - 'apps/mobile/tool/update-readme-screenshots.sh'
      - 'apps/mobile/tool/validate_readme_screenshots.dart'
      - 'apps/mobile/assets/fonts/**'
  workflow_dispatch:

concurrency:
  group: readme-screenshots-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    working-directory: apps/mobile

jobs:
  render:
    name: render README product screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          cache: true

      - name: Render screenshot preview on pull requests
        if: github.event_name == 'pull_request'
        run: ./tool/update-readme-screenshots.sh --update

      - name: Refresh screenshots after merge or manual dispatch
        if: github.event_name != 'pull_request'
        run: ./tool/update-readme-screenshots.sh --update

      - name: Upload rendered screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readme-screenshots-${{ github.run_id }}
          path: |
            docs/assets/readme/generated/**
            docs/assets/readme/failures/**
          if-no-files-found: error
          retention-days: 14

      - name: Detect refreshed assets
        id: changes
        working-directory: ${{ github.workspace }}
        run: |
          if git diff --quiet -- docs/assets/readme/generated; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report screenshot drift on pull requests
        if: github.event_name == 'pull_request' && steps.changes.outputs.changed == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          echo "::warning::README screenshots changed. Review the rendered artifact; main will open a canonical Linux refresh PR after merge."
          git diff --stat -- docs/assets/readme/generated

      - name: Open or refresh screenshot update PR
        if: github.event_name != 'pull_request' && steps.changes.outputs.changed == 'true'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/readme-screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add docs/assets/readme/generated
          git commit -m "docs: refresh README screenshots"
          git push --force origin "HEAD:$BRANCH"

          if [[ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "docs: refresh README screenshots" \
              --body "Automated refresh of README product screenshots from deterministic Flutter fixtures."
          fi
