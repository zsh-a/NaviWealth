name: readme screenshots

on:
  pull_request:
    paths:
      - 'apps/mobile/lib/**'
      - 'apps/mobile/test/readme_screenshots/**'
      - 'apps/mobile/tool/update-readme-screenshots.sh'
      - 'apps/mobile/tool/validate_readme_screenshots.dart'
      - 'apps/mobile/assets/fonts/**'
      - 'docs/assets/readme/**'
      - 'README.md'
      - '.github/workflows/readme-screenshots.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/lib/**'
      - 'apps/mobile/test/readme_screenshots/**'
      - 'apps/mobile/tool/update-readme-screenshots.sh'
      - 'apps/mobile/tool/validate_readme_screenshots.dart'
      - 'apps/mobile/assets/fonts/**'
      - '.github/workflows/readme-screenshots.yml'
  workflow_dispatch:

concurrency:
  group: readme-screenshots-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/mobile

jobs:
  render:
    name: render README product screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          cache: true

      - name: Render deterministic README screenshots
        run: ./tool/update-readme-screenshots.sh --update

      - name: Detect refreshed assets
        id: changes
        working-directory: ${{ github.workspace }}
        run: |
          if git diff --quiet -- docs/assets/readme/generated; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload changed screenshots or failure diagnostics
        if: failure() || steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: readme-screenshots-${{ github.run_id }}
          path: |
            docs/assets/readme/generated/**
            docs/assets/readme/failures/**
          if-no-files-found: error
          retention-days: 14

      - name: Fail when committed screenshots are stale
        if: steps.changes.outputs.changed == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          echo "::error::README screenshots are stale. Download the rendered artifact and commit the refreshed PNG files."
          git diff --stat -- docs/assets/readme/generated
          exit 1
