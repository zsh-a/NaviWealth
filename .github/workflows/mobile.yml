name: mobile

on:
  push:
    branches: [main]
    paths: &mobile-paths
      - 'apps/mobile/**'
      - '!apps/mobile/**/*.md'
      - '!apps/mobile/integration_test/**'
      - '!apps/mobile/test_driver/**'
      - '!apps/mobile/test/golden/**'
      - '!apps/mobile/test/readme_screenshots/**'
      - '!apps/mobile/web_smoke/**'
      - '.github/workflows/mobile.yml'
      - '.github/workflows/release.yml'
      - '.github/actions/mobile-fonts/**'
      - '.github/actions/setup-mobile/**'
      - 'apps/backend/.api-base-url'
      - '.gitmodules'
      - 'docs/fixtures/ai_contract_wire_enums.json'
      - 'docs/fixtures/sync_v3_*.json'
      - 'docs/architecture/agent-runtime-capabilities.json'
      - 'third_party/agent-runtime'
      - 'third_party/market-data-rs/**'
      - 'tool/generate_agent_runtime_capabilities.dart'
      - 'tool/check-*.sh'
      - '!tool/check-sync-wire-fixtures.sh'
      - 'tool/lint-*.sh'
      - 'tool/dart_dependencies.py'
      - 'tool/release.py'
      - 'tool/build-android-release.sh'
      - 'tool/tests/**'
  pull_request:
    paths: *mobile-paths

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/mobile

jobs:
  static-checks:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-mobile
      - run: flutter analyze --fatal-infos
      - name: Project static contracts and boundaries
        working-directory: ${{ github.workspace }}
        run: ./tool/check-mobile-static.sh

  test-shards:
    name: test shard ${{ matrix.shard }} / 4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mobile
      - name: Prepare test result directory
        run: mkdir -p test-results
      - name: Run tests
        run: >
          node tool/run-test-shard.mjs
          --total-shards=4
          --shard-index=${{ matrix.shard }}
          --
          --reporter=expanded
          --file-reporter=json:test-results/shard-${{ matrix.shard }}.json
          --concurrency=4
      - name: Summarize this shard
        if: always()
        continue-on-error: true
        run: |
          events="test-results/shard-${{ matrix.shard }}.json"
          if [ -f "$events" ]; then
            node tool/summarize-test-events.mjs "$events" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload failed shard test events
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-events-shard-${{ matrix.shard }}
          path: apps/mobile/test-results/shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 7

  web:
    name: build production Web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mobile
        with:
          fonts: real
      - name: Build production Web bundle
        run: |
          api_url="$(tr -d '\r\n' < ../backend/.api-base-url)"
          bash tool/build-web.sh --release --source-maps \
            --dart-define="API_BASE_URL=$api_url" \
            --dart-define="GIT_SHA=$GITHUB_SHA"
      - name: Verify bundled securities catalog
        working-directory: ${{ github.workspace }}
        run: cmp apps/mobile/assets/catalog/securities.v1.ndjson apps/mobile/build/web/assets/assets/catalog/securities.v1.ndjson
      - name: Upload production Web bundle
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-build
          path: apps/mobile/build/web
          if-no-files-found: error
          retention-days: 7

  deploy-pages:
    name: deploy Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [web, static-checks, test-shards]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    concurrency:
      group: pages-deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
      - name: Download mobile web artifact
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        uses: actions/download-artifact@v8
        with:
          name: mobile-web-build
          path: apps/mobile/build/web
      - name: Skip Cloudflare Pages deploy
        if: env.HAS_CLOUDFLARE_API_TOKEN != 'true'
        working-directory: ${{ github.workspace }}
        run: echo "::notice::CLOUDFLARE_API_TOKEN not set in GitHub Secrets — skipping Pages deploy."
      - name: Deploy to Cloudflare Pages
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/mobile
          command: pages deploy --branch main
