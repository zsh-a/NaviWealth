name: mobile

on:
  workflow_call:
  push:
    branches: [main]
    paths: &mobile-paths
      - 'apps/mobile/**'
      - '!apps/mobile/**/*.md'
      - '!apps/mobile/web_smoke/**'
      - '!apps/mobile/integration_test/**'
      - '!apps/mobile/test_driver/**'
      - '!apps/mobile/test/readme_screenshots/**'
      - '.github/workflows/mobile.yml'
      - '.github/actions/mobile-fonts/**'
      - '.gitmodules'
      - 'docs/fixtures/ai_contract_wire_enums.json'
      - 'docs/fixtures/sync_v3_*.json'
      - 'docs/architecture/agent-runtime-capabilities.json'
      - 'third_party/agent-runtime'
      - 'third_party/market-data-rs/**'
      - 'tool/generate_agent_runtime_capabilities.dart'
      - 'tool/check-*.sh'
      - '!tool/check-sync-wire-fixtures.sh'
      - 'tool/lint-*.sh'
      - 'tool/dart_dependencies.py'
      - 'tool/tests/**'
  pull_request:
    paths: *mobile-paths

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/mobile

jobs:
  static-checks:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - name: Stub font assets for static analysis
        run: tool/prepare-test-font-stubs.sh
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - name: Verify generated code is up to date
        run: |
          dart run build_runner build
          if ! git diff --quiet -- '*.g.dart' '*.freezed.dart'; then
            echo "::error::Generated files are stale. Run 'dart run build_runner build' locally and commit the result."
            git --no-pager diff --stat -- '*.g.dart' '*.freezed.dart'
            exit 1
          fi
      - name: Project static contracts and boundaries
        working-directory: ${{ github.workspace }}
        run: ./tool/check-mobile-static.sh

  test-shards:
    name: test shard ${{ matrix.shard }} / 4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - run: flutter pub get
      - name: Stub font assets required by the Flutter asset bundle
        run: tool/prepare-test-font-stubs.sh
      - name: Prepare test result directory
        run: mkdir -p test-results
      - name: Run tests
        run: >
          flutter test
          --reporter=expanded
          --file-reporter=json:test-results/shard-${{ matrix.shard }}.json
          --concurrency=4
          --exclude-tags=golden
          --total-shards=4
          --shard-index=${{ matrix.shard }}
      - name: Summarize this shard
        if: always()
        continue-on-error: true
        run: |
          events="test-results/shard-${{ matrix.shard }}.json"
          if [ -f "$events" ]; then
            node tool/summarize-test-events.mjs "$events" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload failed shard test events
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-events-shard-${{ matrix.shard }}
          path: apps/mobile/test-results/shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 7

  golden-regression:
    name: golden regression (mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - uses: ./.github/actions/mobile-fonts
      - run: flutter pub get
      - name: Run golden suite
        # The visual baseline is locked to Linux rasterisation. Devs on
        # macOS / Windows skip the comparison via flutter_test_config.dart;
        # this job is the source of truth. A failed match dumps the diff
        # PNG next to the golden so it's recoverable from the artifact.
        run: |
          # PRs keep the responsive task spine; main and releases compare all
          # baselines. Both share one job instead of separate render runners.
          args=(test/golden --tags=golden)
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            args=(test/golden/task_flow_responsive_golden_test.dart --tags=responsive-golden)
          fi
          flutter test "${args[@]}" --reporter=expanded
      - name: Upload golden diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-golden-failures
          path: apps/mobile/test/golden/failures/**
          if-no-files-found: ignore
          retention-days: 7

  build-web:
    name: build web
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - uses: ./.github/actions/mobile-fonts
      - run: flutter pub get
      - name: Read backend API URL
        id: api-url
        working-directory: ${{ github.workspace }}
        run: echo "url=$(cat apps/backend/.api-base-url | tr -d '\n')" >> "$GITHUB_OUTPUT"
      - run: bash tool/build-web.sh --release --source-maps --dart-define=API_BASE_URL=${{ steps.api-url.outputs.url }} --dart-define=GIT_SHA=${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-web-build
          path: apps/mobile/build/web
          retention-days: 7
          if-no-files-found: error

  deploy-pages:
    name: deploy Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [build-web, static-checks, test-shards, golden-regression]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    concurrency:
      group: pages-deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
      - name: Download mobile web artifact
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        uses: actions/download-artifact@v8
        with:
          name: mobile-web-build
          path: apps/mobile/build/web
      - name: Skip Cloudflare Pages deploy
        if: env.HAS_CLOUDFLARE_API_TOKEN != 'true'
        working-directory: ${{ github.workspace }}
        run: echo "::notice::CLOUDFLARE_API_TOKEN not set in GitHub Secrets — skipping Pages deploy."
      - name: Deploy to Cloudflare Pages
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/mobile
          command: pages deploy --branch main
