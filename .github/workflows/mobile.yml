name: mobile

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'apps/backend/src/ai/**'
      - 'apps/backend/src/bin/tool_descriptor_dump.rs'
      - '.github/workflows/mobile.yml'
      - 'codecov.yml'
      - 'docs/ai-protocol.md'
      - 'docs/fixtures/ai_contract_wire_enums.json'
      - 'docs/fixtures/sync_v2_*.json'
      - 'apps/mobile/tool/check-back-nav-coverage.sh'
      - 'apps/mobile/tool/check-l10n-parity.sh'
      - 'apps/mobile/tool/check-ui-baselines.sh'
      - 'tool/check-ai-contract-wire-enums.sh'
      - 'tool/check-enum-mirror.sh'
      - 'tool/check-sync-client-wire-fixtures.sh'
      - 'tool/check-tool-descriptors.sh'
      - 'tool/lint-money-display.sh'
      - 'tool/lint-no-finance-in-core.sh'
      - 'tool/lint-no-feature-in-shared.sh'
      - 'tool/lint-cross-feature-imports.sh'
      - 'tool/lint-finance-domain-model-path.sh'
      - 'tool/lint-row-family-prefix.sh'
      - 'tool/lint-domain-neutral-contracts.sh'
      - 'tool/lint-frb-llm-entrypoints.sh'
      - 'tool/money-display-to-string-allowlist.txt'
      - 'tool/fetch-onnxruntime.sh'
      - 'tool/embed-onnxruntime-android.sh'
      - 'tool/embed-onnxruntime-macos.sh'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'apps/backend/src/ai/**'
      - 'apps/backend/src/bin/tool_descriptor_dump.rs'
      - '.github/workflows/mobile.yml'
      - 'codecov.yml'
      - 'docs/ai-protocol.md'
      - 'docs/fixtures/ai_contract_wire_enums.json'
      - 'docs/fixtures/sync_v2_*.json'
      - 'apps/mobile/tool/check-back-nav-coverage.sh'
      - 'apps/mobile/tool/check-l10n-parity.sh'
      - 'apps/mobile/tool/check-ui-baselines.sh'
      - 'tool/check-ai-contract-wire-enums.sh'
      - 'tool/check-enum-mirror.sh'
      - 'tool/check-sync-client-wire-fixtures.sh'
      - 'tool/check-tool-descriptors.sh'
      - 'tool/lint-money-display.sh'
      - 'tool/lint-no-finance-in-core.sh'
      - 'tool/lint-no-feature-in-shared.sh'
      - 'tool/lint-cross-feature-imports.sh'
      - 'tool/lint-finance-domain-model-path.sh'
      - 'tool/lint-row-family-prefix.sh'
      - 'tool/lint-domain-neutral-contracts.sh'
      - 'tool/lint-frb-llm-entrypoints.sh'
      - 'tool/money-display-to-string-allowlist.txt'
      - 'tool/fetch-onnxruntime.sh'
      - 'tool/embed-onnxruntime-android.sh'
      - 'tool/embed-onnxruntime-macos.sh'

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/mobile

jobs:
  prepare-font-assets:
    name: prepare font assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build generated font assets
        env:
          CHECK_CN_FONT_SIZE: 'false'
        # These files are gitignored build artifacts. Build them once per
        # workflow and fan them out to all jobs that render UI or web bundles.
        run: |
          tool/build-cn-fonts.sh
          tool/build-latin-fonts.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-font-assets
          path: apps/mobile/assets/fonts/*.woff2
          if-no-files-found: error
          retention-days: 1

  static-checks:
    name: static checks
    runs-on: ubuntu-latest
    needs: prepare-font-assets
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: mobile-font-assets
          path: apps/mobile/assets/fonts
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - name: Verify generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          if ! git diff --quiet -- '*.g.dart' '*.freezed.dart'; then
            echo "::error::Generated files are stale. Run 'dart run build_runner build --delete-conflicting-outputs' locally and commit the result."
            git --no-pager diff --stat -- '*.g.dart' '*.freezed.dart'
            exit 1
          fi
      - name: ARB l10n key parity — en/zh define the same key set
        # Otherwise zh users see English at runtime via the silent fallback.
        run: ./tool/check-l10n-parity.sh
      - name: UI a11y + performance baselines
        # Focused P1 gate for assistive-tech semantics and hot-path perf
        # budgets. Full flutter test still runs below with the known-failure
        # footprint pinning.
        run: ./tool/check-ui-baselines.sh
      - name: Back navigation coverage
        run: ./tool/check-back-nav-coverage.sh
      - name: Contract & boundary lints
        # High-value architecture gates, run from the repo root:
        #   - enum mirror: Dart↔Rust enums stay in sync (Wave 42)
        #   - money display: no naked toStringAsFixed (allowlisted)
        #   - LifeOS D-1 cross-domain shell boundaries (docs/lifeos-shell.md §11):
        #       no Finance in core/ai/runtime/, no shared-layer feature imports,
        #       no cross-feature imports in protected features, sync RowChange
        #       domain prefixes, domain-neutral contracts.
        working-directory: ${{ github.workspace }}
        run: |
          ./tool/check-enum-mirror.sh
          ./tool/check-sync-client-wire-fixtures.sh
          ./tool/check-tool-descriptors.sh
          ./tool/lint-money-display.sh --strict
          ./tool/lint-no-finance-in-core.sh
          ./tool/lint-no-feature-in-shared.sh
          ./tool/lint-cross-feature-imports.sh
          ./tool/lint-finance-domain-model-path.sh
          ./tool/lint-row-family-prefix.sh
          ./tool/lint-domain-neutral-contracts.sh
          ./tool/lint-frb-llm-entrypoints.sh

  test-shards:
    name: test shard ${{ matrix.shard }} / 3
    runs-on: ubuntu-latest
    needs: prepare-font-assets
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: mobile-font-assets
          path: apps/mobile/assets/fonts
      - run: flutter --version
      - run: flutter pub get
      - name: Run tests
        run: >
          flutter test
          --coverage
          --coverage-path=coverage/lcov-${{ matrix.shard }}.info
          --reporter=expanded
          --exclude-tags=golden
          --total-shards=4
          --shard-index=${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage-shard-${{ matrix.shard }}
          path: apps/mobile/coverage/lcov-${{ matrix.shard }}.info
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: coverage upload
    runs-on: ubuntu-latest
    needs: test-shards
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: mobile-coverage-shard-*
          merge-multiple: true
          path: apps/mobile/coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: apps/mobile/coverage/lcov-0.info,apps/mobile/coverage/lcov-1.info,apps/mobile/coverage/lcov-2.info,apps/mobile/coverage/lcov-3.info
          flags: mobile
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: apps/mobile/coverage/lcov-*.info
          if-no-files-found: error

  analyze-and-test:
    name: analyze + test (coverage)
    runs-on: ubuntu-latest
    needs: [static-checks, test-shards, coverage]
    steps:
      - working-directory: ${{ github.workspace }}
        run: echo "static checks, test shards, and coverage upload passed"

  golden-regression:
    name: golden regression (mobile)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: mobile-font-assets
          path: apps/mobile/assets/fonts
      - run: flutter pub get
      - name: Run mobile golden suite (FIR-113)
        # The visual baseline is locked to Linux rasterisation. Devs on
        # macOS / Windows skip the comparison via flutter_test_config.dart;
        # this job is the source of truth. A failed match dumps the diff
        # PNG next to the golden so it's recoverable from the artifact.
        run: flutter test test/golden --tags=golden --reporter=expanded
      - name: Upload golden diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-golden-failures
          path: |
            apps/mobile/test/golden/failures/**
            apps/mobile/test/golden/goldens/**
          if-no-files-found: ignore
          retention-days: 7

  build-web:
    name: build web
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: mobile-font-assets
          path: apps/mobile/assets/fonts
      - run: flutter pub get
      - name: Materialize drift web assets (sqlite3.wasm + drift_worker.dart.js)
        run: tool/setup-drift-web.sh
      - name: Read backend API URL
        id: api-url
        working-directory: ${{ github.workspace }}
        run: echo "url=$(cat apps/backend/.api-base-url | tr -d '\n')" >> "$GITHUB_OUTPUT"
      - run: flutter build web --release --source-maps --dart-define=API_BASE_URL=${{ steps.api-url.outputs.url }} --dart-define=GIT_SHA=${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-web-build
          path: apps/mobile/build/web
          retention-days: 7
          if-no-files-found: error

  deploy-pages:
    name: deploy Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build-web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    concurrency:
      group: pages-deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
      - name: Download mobile web artifact
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        uses: actions/download-artifact@v8
        with:
          name: mobile-web-build
          path: apps/mobile/build/web
      - name: Skip Cloudflare Pages deploy
        if: env.HAS_CLOUDFLARE_API_TOKEN != 'true'
        working-directory: ${{ github.workspace }}
        run: echo "::notice::CLOUDFLARE_API_TOKEN not set in GitHub Secrets — skipping Pages deploy."
      - name: Deploy to Cloudflare Pages
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/mobile
          command: pages deploy --branch main
