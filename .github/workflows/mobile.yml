name: mobile

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile.yml'
      - 'codecov.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile.yml'
      - 'codecov.yml'

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/mobile

jobs:
  analyze-and-test:
    name: analyze + test (coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Stub web-only font assets so test asset bundle resolves
        run: |
          mkdir -p assets/fonts
          touch assets/fonts/app-cn-base.woff2 assets/fonts/app-cn-ext.woff2
      - run: flutter analyze --fatal-infos
      - name: Verify generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          if ! git diff --quiet -- '*.g.dart' '*.freezed.dart'; then
            echo "::error::Generated files are stale. Run 'dart run build_runner build --delete-conflicting-outputs' locally and commit the result."
            git --no-pager diff --stat -- '*.g.dart' '*.freezed.dart'
            exit 1
          fi
      - run: flutter test --coverage --reporter=expanded
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: apps/mobile/coverage/lcov.info
          flags: mobile
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: apps/mobile/coverage/lcov.info
          if-no-files-found: error

  build-web:
    name: build web
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Materialize drift web assets (sqlite3.wasm + drift_worker.dart.js)
        run: tool/setup-drift-web.sh
      - name: Build CN web font subsets (app-cn-base.woff2 + app-cn-ext.woff2)
        # Fails the build if app-cn-base.woff2 exceeds the 250 KB budget.
        run: tool/build-cn-fonts.sh
      - name: Read backend API URL
        id: api-url
        run: echo "url=$(cat apps/backend/.api-base-url | tr -d '\n')" >> "$GITHUB_OUTPUT"
      - run: flutter build web --release --source-maps --dart-define=API_BASE_URL=${{ steps.api-url.outputs.url }}
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-web-build
          path: apps/mobile/build/web
          retention-days: 7
          if-no-files-found: error

