name: mobile

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile.yml'
      - 'docs/fixtures/ai_contract_wire_enums.json'
      - 'docs/fixtures/sync_v3_*.json'
      - 'docs/architecture/agent-runtime-capabilities.json'
      - 'third_party/agent-runtime'
      - 'tool/generate_agent_runtime_capabilities.dart'
      - 'tool/check-ai-contract-wire-enums.sh'
      - 'tool/check-sync-client-wire-fixtures.sh'
      - 'tool/check-mobile-static.sh'
      - 'tool/check-frb-version-alignment.sh'
      - 'tool/lint-motion-policy.sh'
      - 'tool/lint-no-feature-in-shared.sh'
      - 'tool/lint-cross-feature-imports.sh'
      - 'tool/lint-finance-domain-data-imports.sh'
      - 'tool/lint-domain-neutral-contracts.sh'
      - 'tool/lint-frb-llm-entrypoints.sh'
      - 'tool/lint-theme-layering.sh'
      - 'tool/lint-material-chrome.sh'
      - 'tool/lint-format-path.sh'
      - 'tool/lint-typography.sh'
      - 'tool/lint-async-value.sh'
      - 'tool/lint-interaction-primitives.sh'
      - 'tool/check-design-tokens-export.sh'
      - 'tool/check-android-native-libs.sh'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile.yml'
      - 'docs/fixtures/ai_contract_wire_enums.json'
      - 'docs/fixtures/sync_v3_*.json'
      - 'docs/architecture/agent-runtime-capabilities.json'
      - 'third_party/agent-runtime'
      - 'tool/generate_agent_runtime_capabilities.dart'
      - 'tool/check-ai-contract-wire-enums.sh'
      - 'tool/check-sync-client-wire-fixtures.sh'
      - 'tool/check-mobile-static.sh'
      - 'tool/check-frb-version-alignment.sh'
      - 'tool/lint-motion-policy.sh'
      - 'tool/lint-no-feature-in-shared.sh'
      - 'tool/lint-cross-feature-imports.sh'
      - 'tool/lint-finance-domain-data-imports.sh'
      - 'tool/lint-domain-neutral-contracts.sh'
      - 'tool/lint-frb-llm-entrypoints.sh'
      - 'tool/lint-theme-layering.sh'
      - 'tool/lint-material-chrome.sh'
      - 'tool/lint-format-path.sh'
      - 'tool/lint-typography.sh'
      - 'tool/lint-async-value.sh'
      - 'tool/lint-interaction-primitives.sh'
      - 'tool/check-design-tokens-export.sh'
      - 'tool/check-android-native-libs.sh'

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/mobile

jobs:
  prepare-font-assets:
    name: prepare font assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build generated font assets
        env:
          CHECK_CN_FONT_SIZE: 'false'
        # These files are gitignored build artifacts. Build them once per
        # workflow and fan them out to all jobs that render UI or web bundles.
        run: |
          tool/build-cn-fonts.sh
          tool/build-latin-fonts.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-font-assets
          path: |
            apps/mobile/assets/fonts/*.woff2
            apps/mobile/assets/fonts/*.ttf
          if-no-files-found: error
          retention-days: 1

  static-checks:
    name: static checks
    runs-on: ubuntu-latest
    needs: prepare-font-assets
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: mobile-font-assets
          path: apps/mobile/assets/fonts
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - name: Verify generated code is up to date
        run: |
          dart run build_runner build
          if ! git diff --quiet -- '*.g.dart' '*.freezed.dart'; then
            echo "::error::Generated files are stale. Run 'dart run build_runner build' locally and commit the result."
            git --no-pager diff --stat -- '*.g.dart' '*.freezed.dart'
            exit 1
          fi
      - name: Project static contracts and boundaries
        working-directory: ${{ github.workspace }}
        run: ./tool/check-mobile-static.sh

  test-shards:
    name: test shard ${{ matrix.shard }} / 4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - run: flutter pub get
      - name: Stub font assets required by the Flutter asset bundle
        run: tool/prepare-test-font-stubs.sh
      - name: Prepare test result directory
        run: mkdir -p test-results
      - name: Run tests
        run: >
          flutter test
          --reporter=expanded
          --file-reporter=json:test-results/shard-${{ matrix.shard }}.json
          --concurrency=4
          --exclude-tags=golden
          --total-shards=4
          --shard-index=${{ matrix.shard }}
      - name: Upload shard test events
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-events-shard-${{ matrix.shard }}
          path: apps/mobile/test-results/shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 7

  test-timing-summary:
    name: test timing summary
    runs-on: ubuntu-latest
    needs: test-shards
    if: always()
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Prepare merged test event directory
        working-directory: ${{ github.workspace }}
        run: mkdir -p test-results
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: mobile-test-events-shard-*
          path: test-results
          merge-multiple: true
      - name: Summarize shard and slow-test timing
        working-directory: ${{ github.workspace }}
        run: |
          if find test-results -name '*.json' -print -quit | grep -q .; then
            node apps/mobile/tool/summarize-test-events.mjs test-results >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Flutter test timing' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'No shard event artifacts were available.' >> "$GITHUB_STEP_SUMMARY"
          fi

  responsive-golden-pr:
    name: responsive task-flow goldens
    runs-on: ubuntu-latest
    needs: prepare-font-assets
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: mobile-font-assets
          path: apps/mobile/assets/fonts
      - run: flutter pub get
      - name: Run responsive task-flow golden suite
        run: >
          flutter test test/golden/task_flow_responsive_golden_test.dart
          --tags=responsive-golden
          --reporter=expanded
      - name: Upload responsive golden diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-task-flow-golden-failures
          path: |
            apps/mobile/test/golden/failures/**
            apps/mobile/test/golden/goldens/**
          if-no-files-found: ignore
          retention-days: 7

  golden-regression:
    name: golden regression (mobile)
    runs-on: ubuntu-latest
    needs: [prepare-font-assets, static-checks, test-shards]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: mobile-font-assets
          path: apps/mobile/assets/fonts
      - run: flutter pub get
      - name: Run mobile golden suite (FIR-113)
        # The visual baseline is locked to Linux rasterisation. Devs on
        # macOS / Windows skip the comparison via flutter_test_config.dart;
        # this job is the source of truth. A failed match dumps the diff
        # PNG next to the golden so it's recoverable from the artifact.
        run: flutter test test/golden --tags=golden --reporter=expanded
      - name: Upload golden diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-golden-failures
          path: |
            apps/mobile/test/golden/failures/**
            apps/mobile/test/golden/goldens/**
          if-no-files-found: ignore
          retention-days: 7

  build-android:
    name: build Android arm64 AAB
    runs-on: ubuntu-latest
    needs: [prepare-font-assets, static-checks, test-shards]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/native/lifeos_native
      - uses: actions/download-artifact@v8
        with:
          name: mobile-font-assets
          path: apps/mobile/assets/fonts
      - run: flutter pub get
      - name: Build release app bundle
        run: >
          flutter build appbundle
          --release
          --target-platform android-arm64
          --android-project-arg=naviwealth-arm64-only=true
          --dart-define=API_BASE_URL=http://127.0.0.1:8787
          --dart-define=GIT_SHA=${{ github.sha }}
      - name: Verify arm64 native payload and 16 KiB compatibility
        run: ../../tool/check-android-native-libs.sh build/app/outputs/bundle/release/app-release.aab
  build-web:
    name: build web
    runs-on: ubuntu-latest
    needs: [prepare-font-assets, static-checks, test-shards]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: mobile-font-assets
          path: apps/mobile/assets/fonts
      - run: flutter pub get
      - name: Read backend API URL
        id: api-url
        working-directory: ${{ github.workspace }}
        run: echo "url=$(cat apps/backend/.api-base-url | tr -d '\n')" >> "$GITHUB_OUTPUT"
      - run: bash tool/build-web.sh --release --source-maps --dart-define=API_BASE_URL=${{ steps.api-url.outputs.url }} --dart-define=GIT_SHA=${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-web-build
          path: apps/mobile/build/web
          retention-days: 7
          if-no-files-found: error

  deploy-pages:
    name: deploy Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build-web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    concurrency:
      group: pages-deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
      - name: Download mobile web artifact
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        uses: actions/download-artifact@v8
        with:
          name: mobile-web-build
          path: apps/mobile/build/web
      - name: Skip Cloudflare Pages deploy
        if: env.HAS_CLOUDFLARE_API_TOKEN != 'true'
        working-directory: ${{ github.workspace }}
        run: echo "::notice::CLOUDFLARE_API_TOKEN not set in GitHub Secrets — skipping Pages deploy."
      - name: Deploy to Cloudflare Pages
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/mobile
          command: pages deploy --branch main
