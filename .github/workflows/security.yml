name: security-audit

on:
  schedule:
    # Weekly Mondays 03:17 UTC — off-peak to avoid runner contention.
    - cron: '17 3 * * 1'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/security.yml'
      - 'apps/mobile/pubspec.yaml'
      - 'apps/mobile/pubspec.lock'
      - 'apps/backend/Cargo.toml'
      - 'apps/backend/Cargo.lock'

permissions:
  contents: read
  issues: write

jobs:
  pub-outdated:
    name: dart pub outdated
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Report outdated dependencies (human-readable)
        run: dart pub outdated --mode=outdated
      - name: Capture outdated report (JSON)
        run: dart pub outdated --json > pub-outdated.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: pub-outdated
          path: apps/mobile/pub-outdated.json
          if-no-files-found: warn

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/backend
          shared-key: backend-audit
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Run cargo audit
        run: cargo audit --deny warnings

  trivy-fs:
    name: trivy fs (lockfile vulns)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table
