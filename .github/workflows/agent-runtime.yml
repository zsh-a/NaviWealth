name: agent-runtime

on:
  push:
    branches: [main]
    paths:
      - '.gitmodules'
      - 'third_party/agent-runtime'
      - '.github/workflows/agent-runtime.yml'
  pull_request:
    paths:
      - '.gitmodules'
      - 'third_party/agent-runtime'
      - '.github/workflows/agent-runtime.yml'

concurrency:
  group: agent-runtime-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime-submodule:
    name: agent-runtime submodule
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: third_party/agent-runtime
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install submodule-pinned Rust toolchain
        run: |
          rustup toolchain install
          rustc -Vv
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/agent-runtime
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
