name: agent-runtime

on:
  push:
    branches: [main]
    paths:
      - 'rust-toolchain.toml'
      - '.cargo/config.toml'
      - '.gitmodules'
      - 'third_party/agent-runtime'
      - 'crates/health-core/**'
      - 'apps/mobile/native/lifeos_native/**'
      - 'apps/mobile/lib/src/rust/**'
      - '.github/workflows/agent-runtime.yml'
  pull_request:
    paths:
      - 'rust-toolchain.toml'
      - '.cargo/config.toml'
      - '.gitmodules'
      - 'third_party/agent-runtime'
      - 'crates/health-core/**'
      - 'apps/mobile/native/lifeos_native/**'
      - 'apps/mobile/lib/src/rust/**'
      - '.github/workflows/agent-runtime.yml'

concurrency:
  group: agent-runtime-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime-submodule:
    name: agent-runtime submodule
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: third_party/agent-runtime
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install submodule-pinned Rust toolchain
        run: |
          rustup toolchain install
          rustc -Vv
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/agent-runtime
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked

  native-bridge:
    name: lifeos_native Rust workspace
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile/native/lifeos_native
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install configured Rust toolchain
        run: |
          rustup toolchain install
          rustc -Vv
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/native/lifeos_native
      - run: cargo test --locked
      - run: cargo test --manifest-path ../../../../crates/health-core/Cargo.toml --locked
