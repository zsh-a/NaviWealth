name: agent-runtime

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'schemas/agent-runtime/**'
      - 'fixtures/agent-runtime/**'
      - 'evals/agent-runtime/**'
      - 'examples/agent-runtime/**'
      - 'openapi/agent-runtime-api.yaml'
      - 'apps/mobile/native/lifeos_native/**'
      - 'docs/architecture/agent-runtime-current.md'
      - '.github/workflows/agent-runtime.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'schemas/agent-runtime/**'
      - 'fixtures/agent-runtime/**'
      - 'evals/agent-runtime/**'
      - 'examples/agent-runtime/**'
      - 'openapi/agent-runtime-api.yaml'
      - 'apps/mobile/native/lifeos_native/**'
      - 'docs/architecture/agent-runtime-current.md'
      - '.github/workflows/agent-runtime.yml'

concurrency:
  group: agent-runtime-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  root-crates:
    name: root Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace

  native-bridge:
    name: lifeos_native Rust workspace
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile/native/lifeos_native
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/native/lifeos_native
      - run: cargo test
