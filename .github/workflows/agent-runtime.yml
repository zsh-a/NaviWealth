name: agent-runtime

on:
  push:
    branches: [main]
    paths:
      - '.gitmodules'
      - 'third_party/agent-runtime'
      - 'apps/mobile/native/lifeos_native/**'
      - 'apps/mobile/lib/app/agent_runtime/**'
      - 'apps/mobile/lib/src/rust/**'
      - 'apps/mobile/test/app/agent_runtime_*.dart'
      - 'apps/mobile/test/app/frb_chat_runner_test.dart'
      - 'docs/architecture/agent-runtime-current.md'
      - 'docs/architecture/rust-agent-runtime-mvp.md'
      - '.github/workflows/agent-runtime.yml'
  pull_request:
    paths:
      - '.gitmodules'
      - 'third_party/agent-runtime'
      - 'apps/mobile/native/lifeos_native/**'
      - 'apps/mobile/lib/app/agent_runtime/**'
      - 'apps/mobile/lib/src/rust/**'
      - 'apps/mobile/test/app/agent_runtime_*.dart'
      - 'apps/mobile/test/app/frb_chat_runner_test.dart'
      - 'docs/architecture/agent-runtime-current.md'
      - 'docs/architecture/rust-agent-runtime-mvp.md'
      - '.github/workflows/agent-runtime.yml'

concurrency:
  group: agent-runtime-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime-submodule:
    name: agent-runtime submodule
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: third_party/agent-runtime
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/agent-runtime
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace

  native-bridge:
    name: lifeos_native Rust workspace
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile/native/lifeos_native
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/native/lifeos_native
      - run: cargo test

  flutter-consumer-contracts:
    name: Flutter embedded-runtime contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run embedded-runtime consumer tests
        run: >
          flutter test
          test/app/agent_runtime_catalog_test.dart
          test/app/agent_runtime_native_bridge_test.dart
          test/app/agent_runtime_runner_test.dart
          test/app/agent_runtime_tool_host_test.dart
          test/app/agent_runtime_proposal_bridge_test.dart
          test/app/agent_runtime_trace_recorder_test.dart
          test/app/frb_chat_runner_test.dart
          --reporter=expanded
