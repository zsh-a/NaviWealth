name: backend

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend.yml'
      - 'codecov.yml'
  pull_request:
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend.yml'
      - 'codecov.yml'

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/backend

jobs:
  check:
    name: fmt + clippy + check (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/backend
      - run: cargo fmt --all -- --check
      - run: cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings
      - run: cargo check --target wasm32-unknown-unknown --all-targets

  deploy:
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_LLM_API_KEY: ${{ secrets.LLM_API_KEY != '' }}
    concurrency:
      group: backend-deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        with:
          workspaces: apps/backend
      - name: Skip Cloudflare deploy
        if: env.HAS_CLOUDFLARE_API_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN not set in GitHub Secrets — skipping backend deploy."
      - run: cargo install -q worker-build
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
      - name: Skip LLM API key sync
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true' && env.HAS_LLM_API_KEY != 'true'
        run: echo "::notice::LLM_API_KEY not set in GitHub Secrets — keeping existing Cloudflare Worker secret."
      - name: Apply D1 migrations
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/backend
          command: d1 migrations apply naviwealth
      - name: Deploy to Cloudflare Workers
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true' && env.HAS_LLM_API_KEY != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/backend
          command: deploy
      - name: Deploy to Cloudflare Workers with LLM secret
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true' && env.HAS_LLM_API_KEY == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/backend
          command: deploy
          secrets: |
            LLM_API_KEY
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

  deploy-preview:
    needs: [check]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        with:
          workspaces: apps/backend
      - name: Skip Cloudflare preview deploy
        if: env.HAS_CLOUDFLARE_API_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN not set in GitHub Secrets — skipping backend preview deploy."
      - run: cargo install -q worker-build
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
      - id: upload
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/backend
          command: versions upload --message "PR #${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }}"
