name: backend

on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - 'docs/fixtures/sync_v3_*.json'
      - 'tool/check-sync-wire-fixtures.sh'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'docs/fixtures/sync_v3_*.json'
      - 'tool/check-sync-wire-fixtures.sh'
      - '.github/workflows/backend.yml'

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/backend

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/backend
      - run: cargo fmt --all -- --check
      - run: cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings
      - name: Run backend unit tests (native host target)
        # The crate ships as a wasm32 Worker, but every `#[cfg(test)]`
        # module is plain `#[test]` and the dependency tree compiles for
        # the host target too (verified locally). Running on the host lets
        # the JWT-domain-claim and sync LWW-conflict tests actually gate
        # PRs — previously they compiled but never executed in CI.
        run: cargo test
      - name: Verify sync wire fixtures
        working-directory: ${{ github.workspace }}
        run: ./tool/check-sync-wire-fixtures.sh

  deploy:
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    concurrency:
      group: backend-deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        with:
          workspaces: apps/backend
      - name: Skip Cloudflare deploy
        if: env.HAS_CLOUDFLARE_API_TOKEN != 'true'
        working-directory: ${{ github.workspace }}
        run: echo "::notice::CLOUDFLARE_API_TOKEN not set in GitHub Secrets — skipping backend deploy."
      - name: Apply D1 migrations
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/backend
          command: d1 migrations apply naviwealth --remote
      - name: Deploy to Cloudflare Workers
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/backend
          command: deploy
