name: web-smoke

# Cross-browser smoke for the Flutter web build (FIR-40).
# Runs nightly so a Firefox-only regression in OPFS / IndexedDB doesn't
# sit unnoticed for a week. Manual dispatch is supported for ad-hoc checks
# off a feature branch.

on:
  # schedule disabled — smoke tests are currently failing; re-enable once
  # the Playwright suite is stable.  Manual dispatch still available.
  # schedule:
  #   - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch / SHA to smoke (default: main)'
        required: false
        default: 'main'

concurrency:
  group: web-smoke-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mobile

jobs:
  build:
    name: build web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build CN web font subsets
        run: tool/build-cn-fonts.sh
      - name: Build Latin font subsets (Inter + Outfit)
        run: tool/build-latin-fonts.sh
      - name: Materialize drift web assets
        run: tool/setup-drift-web.sh
      - run: flutter build web --release --source-maps
      - uses: actions/upload-artifact@v4
        with:
          name: web-smoke-build
          path: apps/mobile/build/web
          retention-days: 7
          if-no-files-found: error

  smoke:
    name: smoke (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      # Don't let a Firefox-only failure mask Chromium / WebKit results;
      # every browser's run is interesting on its own.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile/web_smoke/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: web-smoke-build
          path: apps/mobile/build/web

      - name: Install web_smoke deps
        working-directory: apps/mobile/web_smoke
        run: npm ci || npm install

      - name: Install Playwright browser (${{ matrix.browser }})
        working-directory: apps/mobile/web_smoke
        # Install only the browser this matrix slot needs — saves ~3 min
        # vs. `playwright install --with-deps` for all three.
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run smoke (${{ matrix.browser }})
        working-directory: apps/mobile/web_smoke
        env:
          CI: 'true'
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-report-${{ matrix.browser }}
          path: |
            apps/mobile/web_smoke/playwright-report
            apps/mobile/web_smoke/test-results
          retention-days: 14
          if-no-files-found: ignore
