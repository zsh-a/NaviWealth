name: web-smoke

# mobile.yml calls this for PRs and main pushes. Weekly/manual runs cover all
# browsers; main deploys the exact bundle that passed this job's Chromium gate.
on:
  workflow_call:
  schedule:
    # 02:30 UTC Sunday — full browser matrix.
    - cron: '30 2 * * 0'
  workflow_dispatch:

concurrency:
  group: web-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: Web build and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    env:
      FULL_BROWSER_SUITE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mobile
        with:
          fonts: real
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile/web_smoke/package-lock.json
      - name: Build production Web bundle
        run: |
          api_url="$(tr -d '\r\n' < ../backend/.api-base-url)"
          bash tool/build-web.sh --release --source-maps \
            --dart-define="API_BASE_URL=$api_url" \
            --dart-define="GIT_SHA=$GITHUB_SHA"
      - name: Verify bundled securities catalog
        working-directory: ${{ github.workspace }}
        run: cmp apps/mobile/assets/catalog/securities.v1.ndjson apps/mobile/build/web/assets/assets/catalog/securities.v1.ndjson
      - name: Install and run browser smoke
        working-directory: apps/mobile/web_smoke
        env:
          CI: 'true'
          WEB_BUILD_DIR: ${{ github.workspace }}/apps/mobile/build/web
          WEB_SMOKE_RESPONSIVE: ${{ env.FULL_BROWSER_SUITE == 'true' && 'full' || 'compact' }}
        run: |
          npm ci
          if [ "$FULL_BROWSER_SUITE" = true ]; then
            npx playwright install --with-deps
            npx playwright test
          else
            npx playwright install --with-deps chromium
            npx playwright test --project=chromium
          fi
      - name: Upload verified Web bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-build
          path: apps/mobile/build/web
          retention-days: 7
          if-no-files-found: error
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-report
          path: apps/mobile/web_smoke/playwright-report/**
          if-no-files-found: ignore
          retention-days: 7
