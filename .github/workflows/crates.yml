name: Rust domain crates

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'rust-toolchain.toml'
      - '.cargo/config.toml'
      - '.github/workflows/crates.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'rust-toolchain.toml'
      - '.cargo/config.toml'
      - '.github/workflows/crates.yml'

permissions:
  contents: read

concurrency:
  group: crates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.crate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        crate: [navi-storage, navi-finance, navi-health, navi-assistant]
    steps:
      - uses: actions/checkout@v7
      - name: Install configured Rust toolchain
        run: |
          rustup toolchain install
          rustc -Vv
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/${{ matrix.crate }}
      - run: cargo fmt --manifest-path crates/${{ matrix.crate }}/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path crates/${{ matrix.crate }}/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path crates/${{ matrix.crate }}/Cargo.toml --locked
