name: ai-semantic

# Weekly AI semantic surface validation. This is intentionally outside the
# blocking PR path: it catches renderer/corpus drift and can optionally notify
# an external screenshot+vision agent without making ordinary PR checks depend
# on a networked model.
on:
  schedule:
    - cron: '15 3 * * 2'
  workflow_dispatch:

concurrency:
  group: ai-semantic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semantic-surrogate:
    name: semantic surrogate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build semantic font assets
        env:
          CHECK_CN_FONT_SIZE: 'false'
        run: |
          bash tool/build-cn-fonts.sh
          bash tool/build-latin-fonts.sh
      - name: Run deterministic AI semantic checks
        env:
          AI_SEMANTIC_SCREENSHOT_DIR: /tmp/ai-semantic-surfaces
        run: |
          set +e
          bash tool/check-ai-semantic-surfaces.sh 2>&1 | tee /tmp/ai-semantic-surrogate.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - name: Upload semantic surrogate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-semantic-surrogate-log
          path: /tmp/ai-semantic-surrogate.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload semantic vision artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-semantic-vision-artifacts
          path: /tmp/ai-semantic-surfaces
          if-no-files-found: ignore
          retention-days: 7
