name: integration-device

# On-device integration tests (apps/mobile/integration_test/). These open
# the REAL file-backed AppDatabase through the production native connection
# (path_provider + createInBackground + on-disk migration) — the boot path
# every headless `flutter test` bypasses via NativeDatabase.memory.
#
# They need a real device, so they run on an Android emulator rather than
# the unit-test VM. Kept off the fast PR path (emulator boot is slow);
# nightly + manual, plus PRs that touch the harness or the connection code.
on:
  pull_request:
    paths:
      - 'apps/mobile/integration_test/**'
      - 'apps/mobile/tool/run-android-backup-interruption.sh'
      - 'apps/mobile/lib/core/backup/**'
      - 'apps/mobile/lib/core/persistence/**'
      - 'apps/mobile/lib/core/sync/**'
      - 'apps/mobile/native/lifeos_native/**'
      - '.gitmodules'
      - 'third_party/agent-runtime'
      - '.github/workflows/integration-device.yml'
  schedule:
    - cron: '45 2 * * *'
  workflow_dispatch:

concurrency:
  group: integration-device-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android-emulator:
    name: integration_test (android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Stub web-only font assets so the asset bundle resolves
        run: |
          mkdir -p assets/fonts
          touch assets/fonts/app-cn-base.woff2 assets/fonts/app-cn-ext.woff2
          touch assets/fonts/inter-regular.woff2 assets/fonts/inter-medium.woff2 \
                assets/fonts/inter-semibold.woff2 assets/fonts/inter-bold.woff2 \
                assets/fonts/outfit-bold.woff2
      # KVM is required for a hardware-accelerated emulator on the runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run integration_test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          working-directory: apps/mobile
          script: |
            mkdir -p test-results
            device_id="$(adb get-serialno | tr -d '\r')"
            flutter test integration_test/ -d "$device_id" --reporter=expanded --file-reporter=json:test-results/android-integration.json
            bash tool/run-android-backup-interruption.sh
      - name: Upload integration test events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-integration-test-events
          path: |
            apps/mobile/test-results/android-integration.json
            apps/mobile/test-results/android-backup-process-interruption.log
            apps/mobile/test-results/android-backup-process-interruption.json
          if-no-files-found: warn
          retention-days: 7
