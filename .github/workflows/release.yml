name: release

# Tag-driven releases. Convention:
#   mobile-vX.Y.Z       — mobile (Flutter) release
#   backend-vX.Y.Z      — backend (Workers) release
# Both produce a GitHub Release with build artifacts. Build numbers are
# derived from the total commit count on main so they are monotonically
# increasing and reproducible from history alone.

on:
  push:
    tags:
      - 'mobile-v[0-9]+.[0-9]+.[0-9]+'
      - 'backend-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (mobile-vX.Y.Z or backend-vX.Y.Z)'
        required: true

permissions:
  contents: write

jobs:
  meta:
    name: resolve metadata
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.parse.outputs.kind }}
      semver: ${{ steps.parse.outputs.semver }}
      build_number: ${{ steps.parse.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: parse
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$TAG" =~ ^(mobile|backend)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "kind=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "semver=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Tag '$TAG' does not match (mobile|backend)-vX.Y.Z"
            exit 1
          fi
          # Build number = commits reachable from tag (or HEAD if dispatched).
          ref="$TAG"
          if ! git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            ref="HEAD"
          fi
          build="$(git rev-list --count "$ref")"
          echo "build_number=$build" >> "$GITHUB_OUTPUT"
          echo "Resolved: kind=${BASH_REMATCH[1]} semver=${BASH_REMATCH[2]} build=$build"

  mobile-release:
    name: mobile release artifacts
    needs: meta
    if: needs.meta.outputs.kind == 'mobile'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Stamp version into pubspec.yaml
        env:
          SEMVER: ${{ needs.meta.outputs.semver }}
          BUILD: ${{ needs.meta.outputs.build_number }}
        run: |
          set -euo pipefail
          # Replace the leading `version:` line with the tag-derived value.
          # Build number = commit count, semver from tag.
          sed -i -E "s/^version: .*/version: ${SEMVER}+${BUILD}/" pubspec.yaml
          grep '^version:' pubspec.yaml
      - run: flutter pub get
      - run: flutter build web --release --source-maps
      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.keystore"
      - name: Build release APK & AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release
          flutter build appbundle --release
      - name: Package web bundle
        run: |
          cd build/web
          tar -czf "../../naviwealth-web-${{ needs.meta.outputs.semver }}+${{ needs.meta.outputs.build_number }}.tar.gz" .
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: mobile ${{ needs.meta.outputs.semver }} (build ${{ needs.meta.outputs.build_number }})
          generate_release_notes: true
          files: |
            apps/mobile/naviwealth-web-${{ needs.meta.outputs.semver }}+${{ needs.meta.outputs.build_number }}.tar.gz
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/build/app/outputs/bundle/release/app-release.aab

  backend-release:
    name: backend release artifacts
    needs: meta
    if: needs.meta.outputs.kind == 'backend'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/backend
      - name: Stamp version into Cargo.toml
        env:
          SEMVER: ${{ needs.meta.outputs.semver }}
        run: |
          set -euo pipefail
          sed -i -E "0,/^version = \".*\"/s//version = \"${SEMVER}\"/" Cargo.toml
          grep -m1 '^version' Cargo.toml
      - name: Install worker-build
        run: cargo install -q worker-build
      - name: Build worker artifact
        run: worker-build --release
      - name: Package worker bundle
        run: |
          tar -czf "naviwealth-backend-${{ needs.meta.outputs.semver }}+${{ needs.meta.outputs.build_number }}.tar.gz" build/worker
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: backend ${{ needs.meta.outputs.semver }} (build ${{ needs.meta.outputs.build_number }})
          generate_release_notes: true
          files: |
            apps/backend/naviwealth-backend-${{ needs.meta.outputs.semver }}+${{ needs.meta.outputs.build_number }}.tar.gz
