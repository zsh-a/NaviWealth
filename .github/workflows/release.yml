name: release

# Tags publish signed Android artifacts. Web and backend deploy only from main.
# Manual runs must select an existing vX.Y.Z tag in the ref picker.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: resolve tagged source
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.parse.outputs.semver }}
      release_tag: ${{ steps.parse.outputs.release_tag }}
      build_number: ${{ steps.parse.outputs.build_number }}
      commit_sha: ${{ steps.parse.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: parse
        run: python3 tool/release.py metadata --ref "$GITHUB_REF" --sha "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  mobile-release:
    name: publish Android release
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.meta.outputs.semver }}
      RELEASE_BUILD_NUMBER: ${{ needs.meta.outputs.build_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.commit_sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate committed securities catalog
        run: python3 -m tool.asset_catalog.validate_release
      - uses: ./.github/actions/setup-mobile
        with:
          fonts: real
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            apps/mobile/android/**/*.gradle*
            apps/mobile/android/gradle/wrapper/gradle-wrapper.properties
            apps/mobile/pubspec.lock
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/native/lifeos_native
      - name: Build signed Android artifacts
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash tool/build-android-release.sh
      - name: Verify native payload and 16 KiB compatibility
        run: |
          tool/check-android-native-libs.sh apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          tool/check-android-native-libs.sh apps/mobile/build/app/outputs/bundle/release/app-release.aab
      - name: Verify bundled securities catalog
        run: |
          python3 -m tool.asset_catalog.validate_release \
            --archive apps/mobile/build/app/outputs/flutter-apk/app-release.apk \
            --archive apps/mobile/build/app/outputs/bundle/release/app-release.aab
      - name: Package release notes and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.meta.outputs.release_tag }}
        run: python3 tool/release.py package --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/release"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.release_tag }}
          name: v${{ needs.meta.outputs.semver }} (build ${{ needs.meta.outputs.build_number }})
          body_path: ${{ runner.temp }}/release/release-notes.md
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/release/*.apk
            ${{ runner.temp }}/release/*.aab
            ${{ runner.temp }}/release/latest.json
