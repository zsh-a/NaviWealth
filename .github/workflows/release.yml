name: release

# Unified release workflow. Convention:
#   v0.2.0 — stamps version into both mobile (pubspec.yaml) and backend
#            (Cargo.toml), creates a GitHub Release with mobile artifacts,
#            and optionally builds + deploys the backend.
#
# Tag push (vX.Y.Z) always builds both mobile and backend.
# Manual dispatch allows skipping the backend build via the `backend` input.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver version (X.Y.Z)'
        required: true
      backend:
        description: 'Also build & deploy backend'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  meta:
    name: resolve metadata
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.parse.outputs.semver }}
      build_number: ${{ steps.parse.outputs.build_number }}
      do_backend: ${{ steps.flags.outputs.do_backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: parse
        env:
          TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            ver="${TAG#v}"
          else
            ver="$INPUT_VERSION"
          fi
          if [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "semver=$ver" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Version '$ver' does not match X.Y.Z"
            exit 1
          fi
          # Build number = commits reachable from tag (or HEAD if dispatched).
          ref="$TAG"
          if ! git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            ref="HEAD"
          fi
          build="$(git rev-list --count "$ref")"
          echo "build_number=$build" >> "$GITHUB_OUTPUT"
          echo "Resolved: semver=$ver build=$build"
      - id: flags
        env:
          EVENT: ${{ github.event_name }}
          INPUT_BACKEND: ${{ github.event.inputs.backend }}
        run: |
          if [ "$EVENT" = "push" ]; then
            echo "do_backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "do_backend=${INPUT_BACKEND:-true}" >> "$GITHUB_OUTPUT"
          fi

  mobile-release:
    name: mobile release
    needs: meta
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Stamp version into pubspec.yaml
        env:
          SEMVER: ${{ needs.meta.outputs.semver }}
          BUILD: ${{ needs.meta.outputs.build_number }}
        run: |
          set -euo pipefail
          sed -i -E "s/^version: .*/version: ${SEMVER}+${BUILD}/" pubspec.yaml
          grep '^version:' pubspec.yaml
      - run: flutter pub get
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh securities catalog from upstream feeds
        working-directory: ${{ github.workspace }}
        run: |
          ./tool/build-asset-catalog.sh --full --allow-degraded \
            --sources hk_stock,us_stock,crypto
      - name: Build CN web font subsets
        run: bash tool/build-cn-fonts.sh
      - name: Build Latin font subsets (Inter + Outfit)
        run: bash tool/build-latin-fonts.sh
      - name: Read backend API URL
        id: api-url
        working-directory: ${{ github.workspace }}
        run: echo "url=$(cat apps/backend/.api-base-url | tr -d '\n')" >> "$GITHUB_OUTPUT"
      - run: flutter build web --release --source-maps --dart-define=API_BASE_URL=${{ steps.api-url.outputs.url }} --dart-define=GIT_SHA=${{ github.sha }}
      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.keystore"
      - name: Build release APK & AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release --target-platform android-arm64 --dart-define=API_BASE_URL=${{ steps.api-url.outputs.url }} --dart-define=GIT_SHA=${{ github.sha }}
          flutter build appbundle --release --dart-define=API_BASE_URL=${{ steps.api-url.outputs.url }} --dart-define=GIT_SHA=${{ github.sha }}
      - name: Package web bundle
        run: |
          cd build/web
          tar -czf "../../naviwealth-web-${{ needs.meta.outputs.semver }}+${{ needs.meta.outputs.build_number }}.tar.gz" .
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ needs.meta.outputs.semver }} (build ${{ needs.meta.outputs.build_number }})
          generate_release_notes: true
          files: |
            apps/mobile/naviwealth-web-${{ needs.meta.outputs.semver }}+${{ needs.meta.outputs.build_number }}.tar.gz
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/build/app/outputs/bundle/release/app-release.aab

  backend-build:
    name: backend build
    needs: meta
    if: needs.meta.outputs.do_backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/backend
      - name: Stamp version into Cargo.toml
        env:
          SEMVER: ${{ needs.meta.outputs.semver }}
        run: |
          set -euo pipefail
          sed -i -E "0,/^version = \".*\"/s//version = \"${SEMVER}\"/" Cargo.toml
          grep -m1 '^version' Cargo.toml
      - name: Install worker-build
        run: cargo install -q worker-build
      - name: Build worker artifact
        run: worker-build --release
      - name: Package worker bundle
        run: |
          tar -czf "naviwealth-backend-${{ needs.meta.outputs.semver }}+${{ needs.meta.outputs.build_number }}.tar.gz" build/worker
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: backend v${{ needs.meta.outputs.semver }} (build ${{ needs.meta.outputs.build_number }})
          generate_release_notes: true
          files: |
            apps/backend/naviwealth-backend-${{ needs.meta.outputs.semver }}+${{ needs.meta.outputs.build_number }}.tar.gz

  backend-deploy:
    name: backend deploy
    needs: [meta, backend-build]
    if: always() && needs.backend-build.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: backend-deploy-prod
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy credentials
        id: deploy-gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN not set — skipping deploy."
          fi
      - name: Apply D1 migrations
        if: steps.deploy-gate.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/backend
          command: d1 migrations apply naviwealth
      - name: Deploy to Cloudflare Workers
        if: steps.deploy-gate.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/backend
          command: deploy
