name: release

# Unified release workflow. Convention:
#   v0.2.0 — stamps version into both mobile (pubspec.yaml) and backend
#            (Cargo.toml), creates a GitHub Release with the APK artifact,
#            and optionally builds + deploys the backend.
#
# Tag push (vX.Y.Z) always builds the APK, deploys the web PWA to
# Cloudflare Pages, and builds the backend deploy artifact.
# Manual dispatch allows skipping the backend build via the `backend` input.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver version (X.Y.Z)'
        required: true
      backend:
        description: 'Also build & deploy backend'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  meta:
    name: resolve metadata
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.parse.outputs.semver }}
      release_tag: ${{ steps.parse.outputs.release_tag }}
      build_number: ${{ steps.parse.outputs.build_number }}
      do_backend: ${{ steps.flags.outputs.do_backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: parse
        env:
          TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            ver="${TAG#v}"
          else
            ver="$INPUT_VERSION"
          fi
          if [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "semver=$ver" >> "$GITHUB_OUTPUT"
            echo "release_tag=v$ver" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Version '$ver' does not match X.Y.Z"
            exit 1
          fi
          # Build number = total commits reachable from the release tag.
          # For tag pushes the tag already exists; for manual dispatch we
          # look up v$ver (the computed release tag) so the build number is
          # consistent regardless of trigger method.
          ref="v$ver"
          if ! git rev-parse --verify "refs/tags/$ref" >/dev/null 2>&1; then
            ref="HEAD"
          fi
          build="$(git rev-list --count "$ref")"
          echo "build_number=$build" >> "$GITHUB_OUTPUT"
          echo "Resolved: semver=$ver build=$build"
      - id: flags
        env:
          EVENT: ${{ github.event_name }}
          INPUT_BACKEND: ${{ github.event.inputs.backend }}
        run: |
          if [ "$EVENT" = "push" ]; then
            echo "do_backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "do_backend=${INPUT_BACKEND:-true}" >> "$GITHUB_OUTPUT"
          fi

  mobile-release:
    name: mobile release
    needs: meta
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute build number
        id: build
        env:
          SEMVER: ${{ needs.meta.outputs.semver }}
        run: |
          set -euo pipefail
          ref="v${SEMVER}"
          if ! git rev-parse --verify "refs/tags/$ref" >/dev/null 2>&1; then
            ref="HEAD"
          fi
          build="$(git rev-list --count "$ref")"
          echo "number=$build" >> "$GITHUB_OUTPUT"
          echo "Build number: $build (ref=$ref)"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/native/lifeos_native
      - name: Cache ONNX Runtime artifacts
        uses: actions/cache@v5
        with:
          path: .cache/onnxruntime
          key: onnxruntime-${{ runner.os }}-1.24.2
      - name: Stamp version into pubspec.yaml
        env:
          SEMVER: ${{ needs.meta.outputs.semver }}
          BUILD: ${{ steps.build.outputs.number }}
        run: |
          set -euo pipefail
          sed -i -E "s/^version: .*/version: ${SEMVER}+${BUILD}/" pubspec.yaml
          grep '^version:' pubspec.yaml
      - run: flutter pub get
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refresh securities catalog from upstream feeds
        working-directory: ${{ github.workspace }}
        run: |
          ./tool/build-asset-catalog.sh --full --allow-degraded \
            --sources hk_stock,us_stock,crypto
      - name: Build CN web font subsets
        env:
          CHECK_CN_FONT_SIZE: 'false'
        run: bash tool/build-cn-fonts.sh
      - name: Build Latin font subsets (Inter + Outfit)
        run: bash tool/build-latin-fonts.sh
      - name: Materialize drift web assets
        run: bash tool/setup-drift-web.sh
      - name: Read backend API URL
        id: api-url
        working-directory: ${{ github.workspace }}
        run: echo "url=$(cat apps/backend/.api-base-url | tr -d '\n')" >> "$GITHUB_OUTPUT"
      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.keystore"
      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64 --dart-define=API_BASE_URL=${{ steps.api-url.outputs.url }} --dart-define=GIT_SHA=${{ github.sha }}
      - name: Build release web PWA
        run: flutter build web --release --dart-define=API_BASE_URL=${{ steps.api-url.outputs.url }} --dart-define=GIT_SHA=${{ github.sha }}
      - name: Normalize APK filename
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
            "build/app/outputs/flutter-apk/naviwealth-android-arm64-v${{ needs.meta.outputs.semver }}+${{ steps.build.outputs.number }}.apk"
      - name: Generate release notes
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_TAG: ${{ needs.meta.outputs.release_tag }}
          SEMVER: ${{ needs.meta.outputs.semver }}
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
          API_URL: ${{ steps.api-url.outputs.url }}
          RELEASE_NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          bash tool/generate-release-notes.sh \
            "$RELEASE_TAG" \
            "$SEMVER" \
            "$BUILD_NUMBER" \
            "$API_URL" \
            "$RELEASE_NOTES"
      - name: Check Pages deploy credentials
        id: pages-deploy-gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN not set — skipping Pages deploy."
          fi
      - name: Deploy web PWA to Cloudflare Pages
        if: steps.pages-deploy-gate.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/mobile
          command: pages deploy --branch main
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.release_tag }}
          name: v${{ needs.meta.outputs.semver }} (build ${{ steps.build.outputs.number }})
          body_path: ${{ runner.temp }}/release-notes.md
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            apps/mobile/build/app/outputs/flutter-apk/naviwealth-android-arm64-v${{ needs.meta.outputs.semver }}+${{ steps.build.outputs.number }}.apk

  backend-build:
    name: backend build
    needs: meta
    if: needs.meta.outputs.do_backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/backend
      - name: Stamp version into Cargo.toml
        env:
          SEMVER: ${{ needs.meta.outputs.semver }}
        run: |
          set -euo pipefail
          sed -i -E "0,/^version = \".*\"/s//version = \"${SEMVER}\"/" Cargo.toml
          grep -m1 '^version' Cargo.toml
      - name: Install worker-build
        run: cargo install -q worker-build
      - name: Build worker artifact
        run: bash tool/build-worker.sh

  backend-deploy:
    name: backend deploy
    needs: [meta, backend-build]
    if: always() && needs.backend-build.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: backend-deploy-prod
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy credentials
        id: deploy-gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN not set — skipping deploy."
          fi
      - name: Apply D1 migrations
        if: steps.deploy-gate.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/backend
          command: d1 migrations apply naviwealth --remote
      - name: Deploy to Cloudflare Workers
        if: steps.deploy-gate.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/backend
          command: deploy
