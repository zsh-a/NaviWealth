name: nsh client

# The native (NSH, Rust) client in apps/nsh-client, run by hand: checks the
# crate and builds an arm64-v8a APK signed with the repository's fixed
# Android release key. Only the verified release APK is uploaded.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nsh-client-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NSH_VERSION: v0.5.0
  # What nsh-platform-linux links (as nsh's own CI installs them).
  LINUX_PACKAGES: clang libclang-dev libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

jobs:
  checks:
    name: Format, Clippy, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/nsh-client
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Linux backend libraries (GTK 4, GStreamer)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ env.LINUX_PACKAGES }}
      - name: Rust from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/nsh-client
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo test --manifest-path ../../crates/health-core/Cargo.toml --locked
      - name: Signing failure and credential-handling checks
        run: python3 -m unittest discover -s ../../tool/tests -p test_nsh_signing.py

  apk:
    name: Release APK (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        working-directory: apps/nsh-client
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/nsh-client/target
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Linux backend libraries (nsh builds the crate on the host first)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ env.LINUX_PACKAGES }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Rust from rust-toolchain.toml (with aarch64-linux-android)
        run: |
          rustup toolchain install
          rustup target list --installed
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/nsh-client
          key: android
      - name: Android SDK platform, build tools and NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-35" "build-tools;35.0.1" "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: nsh CLI ${{ env.NSH_VERSION }}
        run: |
          curl -fsSL "https://github.com/longbridge/nsh/releases/download/${NSH_VERSION}/install.sh" | sh
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
      - name: Package the NSH app
        run: |
          nsh --version
          nsh package --target android --abi arm64-v8a -o "$RUNNER_TEMP/packaged"
      - name: Sign with the fixed Android release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          apk=$(find "$RUNNER_TEMP/packaged" -maxdepth 1 -name '*.apk' -print -quit)
          bash ../../tool/sign-nsh-apk.sh "$apk" "$RUNNER_TEMP/release-apk/NaviWealth Health.apk"
      - name: Verify the APK (release signature, package, ABI)
        run: |
          apk="$RUNNER_TEMP/release-apk/NaviWealth Health.apk"
          tools="$ANDROID_HOME/build-tools/35.0.1"
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          badging=$("$tools/aapt2" dump badging "$apk")
          printf '%s\n' "$badging" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code|application-label):"
          if grep -q '^application-debuggable' <<< "$badging"; then
            echo '::error::A release APK must not be debuggable'
            exit 1
          fi
          unzip -l "$apk" | grep -E "lib/|classes" || true
      - uses: actions/upload-artifact@v4
        with:
          name: naviwealth-health-nsh-release-arm64-v8a
          path: ${{ runner.temp }}/release-apk/*.apk
          if-no-files-found: error
          retention-days: 14
