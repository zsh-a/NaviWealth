name: nsh client

# The native (NSH, Rust) client in apps/nsh-client, run by hand: checks the
# crate, then builds an arm64-v8a APK signed with the repository's fixed
# Android release key. Only the verified release APK is uploaded.

on:
  workflow_dispatch:
    inputs:
      diagnostics:
        description: Build a diagnostic APK (NW_DIAG=1 shows keyboard and frame diagnostics in Settings)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nsh-client-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NSH_VERSION: v0.5.0
  # What nsh-platform-linux links (as nsh's own CI installs them).
  LINUX_PACKAGES: clang libclang-dev libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

jobs:
  release:
    name: Check, package and sign (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/nsh-client
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/nsh-client/target
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Linux backend libraries (GTK 4, GStreamer)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ env.LINUX_PACKAGES }}
      - name: Rust from rust-toolchain.toml (with aarch64-linux-android)
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/nsh-client
          key: android
      - name: Check the app crate
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: Signing failure and credential-handling checks
        run: python3 -m unittest discover -s ../../tool/tests -p test_nsh_signing.py
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK platform, build tools and NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-35" "build-tools;35.0.1" "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: nsh CLI ${{ env.NSH_VERSION }}
        run: |
          curl -fsSL "https://github.com/longbridge/nsh/releases/download/${NSH_VERSION}/install.sh" | sh
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
      - name: Package the NSH app
        env:
          DIAGNOSTICS: ${{ inputs.diagnostics }}
        run: |
          nsh --version
          # option_env! sees any value, even an empty one: set it only when asked.
          if [ "$DIAGNOSTICS" = "true" ]; then export NW_DIAG=1; fi
          nsh package --target android --abi arm64-v8a --icon icon.png -o "$RUNNER_TEMP/packaged"
      - name: Sign with the fixed Android release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          apk=$(find "$RUNNER_TEMP/packaged" -maxdepth 1 -name '*.apk' -print -quit)
          bash ../../tool/sign-nsh-apk.sh "$apk" "$RUNNER_TEMP/release-apk/NaviWealth.apk"
      - name: Verify the APK (release signature, package, ABI)
        run: |
          apk="$RUNNER_TEMP/release-apk/NaviWealth.apk"
          tools="$ANDROID_HOME/build-tools/35.0.1"
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          badging=$("$tools/aapt2" dump badging "$apk")
          printf '%s\n' "$badging" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code|application-label):"
          if grep -q '^application-debuggable' <<< "$badging"; then
            echo '::error::A release APK must not be debuggable'
            exit 1
          fi
          unzip -l "$apk" | grep -E "lib/|classes" || true
      - uses: actions/upload-artifact@v4
        with:
          name: naviwealth-${{ inputs.diagnostics && 'diagnostic' || 'release' }}-arm64-v8a
          path: ${{ runner.temp }}/release-apk/*.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish the tag's release (APK + SHA256SUMS)
    runs-on: ubuntu-24.04
    needs: release
    # Manual dispatches on a branch verify the crate without publishing;
    # a build of an nsh-v* tag publishes its release itself.
    if: startsWith(github.ref, 'refs/tags/nsh-v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: naviwealth-release-arm64-v8a
          path: artifact
      - name: Sum the APK and write the notes
        run: |
          cd artifact
          sha256sum NaviWealth.apk > SHA256SUMS
          cd ..
          tag="${GITHUB_REF#refs/tags/}"
          prev=$(git tag --sort=-creatordate | grep '^nsh-v' | sed -n '2p')
          {
            git log -1 --format=%b
            printf '\n\n[Full changes](https://github.com/%s/compare/%s...%s)\n\n[Release build](https://github.com/%s/actions/runs/%s) · commit `%s`.\n' \
              "$GITHUB_REPOSITORY" "$prev" "$tag" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA"
          } > notes.md
          title="$(git tag -l --format='%(contents:subject)' "$tag")"
          printf '%s' "$tag" > tag.txt
          printf '%s' "$title" > title.txt
      - name: Create the release with the APK and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(cat tag.txt)"
          title="$(cat title.txt)"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" --clobber artifact/NaviWealth.apk artifact/SHA256SUMS
          else
            gh release create "$tag" --latest --title "$title" --notes-file notes.md \
              artifact/NaviWealth.apk artifact/SHA256SUMS
          fi
