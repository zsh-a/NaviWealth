name: asset-catalog

# CI for the bundled securities catalog build pipeline.
# Runs the offline pytest suite for every adapter parser + the stub
# bake of build-asset-catalog.sh end-to-end. Does NOT exercise the
# `--full` path: BaoStock + mootdx geo-restrict to mainland China and
# the hosted GitHub runners cannot reach them. The actual full ingest
# is a manual / self-hosted-runner step (see tool/asset_catalog/README.md).

on:
  push:
    branches: [main]
    paths:
      - 'tool/asset_catalog/**'
      - 'tool/build-asset-catalog.sh'
      - '.github/workflows/asset-catalog.yml'
  pull_request:
    paths:
      - 'tool/asset_catalog/**'
      - 'tool/build-asset-catalog.sh'
      - '.github/workflows/asset-catalog.yml'

concurrency:
  group: asset-catalog-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: pytest (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test deps
        # The full ingest requires baostock / mootdx / openpyxl /
        # requests / opencc, which we deliberately skip on hosted CI.
        # The pure-parser tests only need pytest + pypinyin.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.* pypinyin==0.51.*
      - name: Run adapter + classify + diff-report tests
        run: python -m pytest tool/asset_catalog/tests -v

  stub-bake:
    name: stub bake (no network)
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bake deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pypinyin==0.51.*
      - name: Snapshot committed bundle body
        # Hash everything except the header line, which carries a
        # date-stamped version that legitimately changes per run.
        id: snapshot
        run: |
          out=apps/mobile/assets/catalog/securities.v1.ndjson
          committed=$(tail -n +2 "$out" | sha256sum | cut -d' ' -f1)
          echo "committed=$committed" >> "$GITHUB_OUTPUT"
          echo "committed body sha256: $committed"
      - name: Bake stub catalog (default mode, no flags)
        env:
          CATALOG_VERSION: v1.ci
        run: ./tool/build-asset-catalog.sh
      - name: Verify gzip stays under budget
        run: |
          out=apps/mobile/assets/catalog/securities.v1.ndjson
          gz=$(gzip -c "$out" | wc -c | tr -d ' ')
          echo "raw:  $(wc -c < "$out") bytes"
          echo "gzip: $gz bytes (budget 819200)"
          if (( gz > 819200 )); then
            echo "::error::gzip catalog exceeds 800KB budget"
            exit 1
          fi
      - name: Verify the committed CSV sources still bake to the committed bundle
        # Drift here means someone edited a CSV without re-running the
        # bake, or vice versa. The build-asset-catalog.sh script must
        # always be re-run after touching anything under sources/.
        run: |
          out=apps/mobile/assets/catalog/securities.v1.ndjson
          baked=$(tail -n +2 "$out" | sha256sum | cut -d' ' -f1)
          committed='${{ steps.snapshot.outputs.committed }}'
          echo "baked     body sha256: $baked"
          echo "committed body sha256: $committed"
          if [[ "$baked" != "$committed" ]]; then
            echo "::error::source CSVs do not match the committed bundle. Run ./tool/build-asset-catalog.sh and commit the result."
            exit 1
          fi
