name: client-android

# Build and release the nsh/Rust client's Android APK.
#
#   - push a tag `client-vX.Y.Z` to publish a GitHub Release with the APK;
#   - or run manually from the Actions tab (workflow_dispatch) to build an
#     artifact without publishing.
#
# The APK is debug-signed for now (no client release keystore yet); when a
# keystore lands, add the signing step like release.yml does for Flutter.
#
# The nsh CLI builds the APK with the SDK build tools (aapt2/zipalign/
# apksigner, no Gradle) and drives cargo for `libnsh.so`. The vendored
# SQLCipher/OpenSSL C code needs the NDK toolchain, so we install the NDK
# and point the cc crate and cargo linkers at its clang wrappers.

on:
  push:
    tags:
      - 'client-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: client-android-${{ github.ref }}
  cancel-in-progress: false

env:
  NSH_VERSION: v0.4.0
  ANDROID_API_LEVEL: '28'

jobs:
  apk:
    name: build android apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK preinstalled (ANDROID_HOME).
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2

      - name: Install nsh CLI
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # `nsh package --target android` also builds a host-side runner
      # (target/debug), and the desktop feature pulls GTK there.
      - name: Install host GTK development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev

      - name: Configure NDK toolchain for cargo
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-root }}
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          API="$ANDROID_API_LEVEL"
          {
            echo "NDK_BIN=$NDK_BIN"
            echo "CC_aarch64_linux_android=$NDK_BIN/aarch64-linux-android${API}-clang"
            echo "AR_aarch64_linux_android=$NDK_BIN/llvm-ar"
            echo "RANLIB_aarch64_linux_android=$NDK_BIN/llvm-ranlib"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_BIN/aarch64-linux-android${API}-clang"
            echo "CC_armv7_linux_androideabi=$NDK_BIN/armv7a-linux-androideabi${API}-clang"
            echo "AR_armv7_linux_androideabi=$NDK_BIN/llvm-ar"
            echo "RANLIB_armv7_linux_androideabi=$NDK_BIN/llvm-ranlib"
            echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$NDK_BIN/armv7a-linux-androideabi${API}-clang"
          } >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: apps/client
        run: nsh package --target android

      - name: Locate APK
        id: apk
        run: |
          apk_path="$(find apps/client/.nsh/out -name '*.apk' | head -n1)"
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$apk_path")" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: naviwealth-android-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/client-v')
        uses: softprops/action-gh-release@v2
        with:
          name: NaviWealth client ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.apk.outputs.path }}
