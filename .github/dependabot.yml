version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: 'ci(deps)'

  - package-ecosystem: cargo
    directory: /apps/nsh-client
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 5
    labels: [dependencies, nsh]
    commit-message:
      prefix: 'chore(nsh-deps)'

  - package-ecosystem: cargo
    directory: /crates/navi-finance
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 5
    labels: [dependencies, finance]
    commit-message:
      prefix: 'chore(finance-deps)'

  - package-ecosystem: cargo
    directory: /crates/navi-health
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 5
    labels: [dependencies, health]
    commit-message:
      prefix: 'chore(health-deps)'

  - package-ecosystem: cargo
    directory: /crates/navi-storage
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 5
    labels: [dependencies, storage]
    commit-message:
      prefix: 'chore(storage-deps)'
