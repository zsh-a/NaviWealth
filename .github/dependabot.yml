version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: 'ci(deps)'

  - package-ecosystem: pub
    directory: /apps/mobile
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 10
    labels: [dependencies, mobile]
    commit-message:
      prefix: 'chore(mobile-deps)'
    groups:
      flutter-dev:
        patterns: ['flutter_lints', 'build_runner', 'freezed*', 'json_serializable', 'drift_dev']
      drift:
        patterns: ['drift', 'sqlite3*', 'sqlcipher*']

  - package-ecosystem: cargo
    directory: /apps/backend
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 10
    labels: [dependencies, backend]
    commit-message:
      prefix: 'chore(backend-deps)'
    groups:
      worker:
        patterns: ['worker', 'worker-*']
      serde:
        patterns: ['serde', 'serde_*']

  - package-ecosystem: npm
    directory: /apps/mobile/web_smoke
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 5
    labels: [dependencies, web]
    commit-message:
      prefix: 'chore(web-deps)'
