[workspace]
resolver = "2"
members = [
    "apps/client",
    "crates/lifeos",
    "crates/finance",
    "crates/knowledge",
    "crates/execution",
    "crates/health",
    "crates/platform",
]
exclude = ["apps/backend", "third_party/agent-runtime", "third_party/market-data-rs", "third_party/nsh-platform-android"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
lifeos = { path = "crates/lifeos" }
naviwealth-finance = { path = "crates/finance" }
naviwealth-knowledge = { path = "crates/knowledge" }
naviwealth-execution = { path = "crates/execution" }
naviwealth-health = { path = "crates/health" }
lifeos-platform = { path = "crates/platform" }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.37", default-features = false }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
