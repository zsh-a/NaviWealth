# Also applies to the workspace generated by nsh under apps/client/.nsh/rust.
[patch.crates-io]
nsh-platform-android = { path = "third_party/nsh-platform-android" }

# Keep workspace backtrace line numbers without full variable/type debug data.
# Applies to tests through their default inheritance from the dev profile.
[profile.dev]
debug = "line-tables-only"

# Third-party dependencies do not need debug data for everyday development.
[profile.dev.package."*"]
debug = 0
