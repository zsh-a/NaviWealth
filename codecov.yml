coverage:
  precision: 2
  round: down
  range: '60...90'
  status:
    project:
      mobile:
        flags: [mobile]
        target: 60%
        threshold: 1%
    patch:
      default:
        target: 70%
        threshold: 1%

flags:
  mobile:
    paths:
      - apps/mobile/lib

ignore:
  - 'apps/mobile/lib/**/*.g.dart'
  - 'apps/mobile/lib/**/*.freezed.dart'
  - 'apps/mobile/test/**'

comment:
  layout: 'reach,diff,flags,tree'
  behavior: default
  require_changes: false
